<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>WorkRelief Notification</title></head>
<body style="margin:0;background-color:#f3f6f8;font-family:Arial,Helvetica,sans-serif;color:#172638;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f6f8"><tr><td align="center" style="padding-top:40px;padding-bottom:40px;padding-left:16px;padding-right:16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:18px;">
<tr><td bgcolor="#ffffff" style="padding:28px 32px 20px;border-top:5px solid {{APP_COLOR}}"><img src="{{BRAND_LOGO_URL}}" alt="{{BRAND_NAME}}" width="184" style="display:block;width:184px;max-width:100%;height:auto;border:0"><p style="margin:12px 0 0;font-size:13px;line-height:20px;font-weight:bold;letter-spacing:1.5px;color:{{APP_COLOR}}">{{APP_NAME}}</p></td></tr>
<tr><td style="padding-top:38px;padding-bottom:15px;padding-left:32px;padding-right:32px;"><p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;font-weight:700;color:#168c78;letter-spacing:1.6px;margin-top:0;margin-bottom:14px;">{{NOTIFICATION_TYPE}}</p><h1 style="font-family:Arial,Helvetica,sans-serif;font-size:27px;line-height:36px;color:#102c40;margin-top:0;margin-bottom:18px;">{{HEADLINE}}</h1><p style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#445569;margin-top:0;margin-bottom:24px;white-space:pre-line;">{{MESSAGE}}</p></td></tr>
<tr><td style="padding-top:0;padding-bottom:34px;padding-left:32px;padding-right:32px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="#10a88a" style="background-color:#10a88a;border-radius:8px;padding-top:14px;padding-bottom:14px;padding-left:24px;padding-right:24px;"><a href="{{ACTION_URL}}" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:18px;font-weight:700;color:#ffffff;text-decoration:none;">{{ACTION_LABEL}} →</a></td></tr></table></td></tr>
<tr><td bgcolor="#f8fafb" style="background-color:#f8fafb;padding-top:22px;padding-bottom:24px;padding-left:32px;padding-right:32px;border-radius:0 0 18px 18px;"><p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#697987;margin-top:0;margin-bottom:8px;">This is a WorkRelief workspace notification. For account security, sign in directly if a link looks unfamiliar.</p><p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#697987;margin-top:0;margin-bottom:0;">© 2026 WorkRelief · Notification preferences are available inside your workspace.</p></td></tr>
</table></td></tr></table></body></html>
