<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Checkout | workrelief</title><style>:root{font-family:Inter,system-ui,Arial;color:#10264b;background:#f4f8ff}*{box-sizing:border-box}body{margin:0}header{padding:18px max(22px,calc((100vw - 1000px)/2));background:white;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe5f7}header img{width:155px}main{max-width:1000px;margin:35px auto;padding:0 20px}.panel{background:white;border:1px solid #dbe5f7;padding:28px;border-radius:16px;margin-bottom:18px}.btn{background:#1768f5;color:white;border:0;border-radius:9px;padding:14px 20px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.err{color:#b42335}select,input{font:inherit;padding:12px;border:1px solid #d1dff1;border-radius:8px}#secure-fields{min-height:80px}a{color:#1768f5}</style></head><body><header><img src="../assets/img/logo.png" alt="workrelief"><a href="purchase-apps.html">← Purchase Apps</a></header><main><small>WORKRELIEF · IN-APP CHECKOUT</small><h1>Secure checkout</h1><p>Checkout stays within your workrelief application. Existing purchases are protected.</p><div class="panel"><h2>Your additions</h2><p id="summary">Validating your workspace and purchases…</p><label>Billing cycle <select id="cycle" disabled><option value="monthly">Monthly</option><option value="annual">Annual</option></select></label><p id="estimate"></p><button class="btn" id="prepare" disabled>Prepare secure payment</button></div><div class="panel"><h2>Payment details</h2><div id="secure-fields"></div><button class="btn" id="pay" hidden disabled>Confirm payment</button><p id="status" role="status"></p></div></main><script src="https://js.stripe.com/clover/stripe.js"></script><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://cqzwoskpgefacghdnuyz.supabase.co','sb_publishable_CoIoX7Pinqd2o4kJwqCTqA_RKmePPZt');const $=id=>document.getElementById(id),qp=new URLSearchParams(location.search);let wid='',apps=[],white=[],seats=0,actions=null,processing=false;const status=(s,error=false)=>{$('status').textContent=s;$('status').classList.toggle('err',error)};const catalog=['crm','scheduling','forms','desk','hr','training','compliance','time','tasks','projects','chat','docs','sign','billing','field','inventory','assets','workflow','ai'];function parse(key){return [...new Set((qp.get(key)||'').split(',').filter(x=>catalog.includes(x)))];}
try{const{data:{user}}=await sb.auth.getUser();if(!user){location.replace('login.html');}else{wid=qp.get('workspace')||'';const{data:member}=await sb.from('workspace_members').select('role').eq('workspace_id',wid).eq('user_id',user.id).maybeSingle();if(!member||member.role!=='owner')throw Error('Only the workspace owner can purchase applications');apps=parse('apps');white=parse('white');seats=Number(qp.get('seats')||0);if(!Number.isInteger(seats)||seats<0||seats>100)throw Error('Invalid seat count');const{data:ent,error}=await sb.from('wr_application_entitlements').select('application_code,white_label_enabled,billing_state').eq('workspace_id',wid);if(error)throw error;const active=(ent||[]).filter(x=>['active','trialing'].includes(x.billing_state));if(apps.some(a=>active.some(x=>x.application_code===a)))throw Error('Some selected applications are already purchased. Return to Purchase Apps.');if(white.some(a=>active.some(x=>x.application_code===a&&x.white_label_enabled)))throw Error('White Label already active for a selected application.');if(white.some(a=>!apps.includes(a)&&!active.some(x=>x.application_code===a)))throw Error('Purchase the corresponding application before adding White Label.');if(!apps.length&&!white.length&&!seats)throw Error('Choose an app, White Label, or team seats.');const{data:orders}=await sb.from('wr_billing_orders').select('billing_cycle').eq('workspace_id',wid).eq('purchase_type','applications').eq('status','active').order('created_at',{ascending:false}).limit(1);$('cycle').value=orders?.[0]?.billing_cycle==='annual'?'annual':'monthly';$('summary').textContent=[apps.length+' new application(s)',white.length+' White Label upgrade(s)',seats+' new team seat(s)'].join(' · ');$('estimate').textContent='Your final amount will be calculated and verified securely before payment.';$('prepare').disabled=false;}}
catch(e){status(e.message||'Could not prepare checkout',true)}
$('prepare').onclick=async()=>{const button=$('prepare');button.disabled=true;try{const{data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw Error('Sign in again');const onlySeats=!!seats&&!apps.length&&!white.length;const body=onlySeats?{purchase_type:'team_seats',workspace_id:wid,additional_seats:seats}:{purchase_type:'app_addon',workspace_id:wid,apps,white_label_apps:white,additional_seats:seats};const r=await fetch('https://cqzwoskpgefacghdnuyz.supabase.co/functions/v1/workrelief-create-checkout',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Checkout unavailable');if(!window.Stripe)throw Error('Stripe did not load');const checkout=window.Stripe(data.publishable_key).initCheckoutElementsSdk({clientSecret:data.client_secret});checkout.createPaymentElement().mount('#secure-fields');const result=await checkout.loadActions();if(result.type!=='success')throw Error(result.error?.message||'Unable to load payment');actions=result.actions;$('pay').hidden=false;$('pay').disabled=false;$('pay').textContent='Pay '+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((data.amount_cents??data.price_cents)/100)+' securely';status('Payment ready.');}catch(e){status(e.message||'Checkout unavailable',true);button.disabled=false;}};
$('pay').onclick=async()=>{if(processing||!actions)return;processing=true;$('pay').disabled=true;try{const result=await actions.confirm();if(result?.error)throw Error(result.error.message);status('Payment submitted. Waiting for verified confirmation.');}catch(e){status(e.message||'Payment could not be confirmed',true);$('pay').disabled=false;processing=false;}};
</script></body></html>
