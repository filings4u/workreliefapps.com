dius:8px;padding:10px 14px;color:white;font-weight:750}.quiet{color:#7685a1;font-size:12px}.chip{padding:5px 9px;border-radius:7px;background:#eaf3ff;color:#145fc8;font-size:11px}.wr-side .wr-section{margin-bottom:14px}.dashitem{background:white;border:1px solid #edf1f8;padding:10px;border-radius:9px;margin:7px 0;cursor:pointer}.dashitem strong{font-size:11px}.dashitem small{font-size:10px;color:#7a8daa;display:block;margin-top:4px}.wr-board .lane{min-width:145px}.no-access{max-width:480px;margin:10vh auto;padding:34px;background:white;border:1px solid #e4ebf5;border-radius:15px}.no-access a{color:#1266f5}.modal{position:fixed;inset:0;background:#0a1b3566;z-index:100;display:grid;place-items:center;padding:15px}.modal[hidden], [hidden]{display:none!important}.dialogbox{background:#fff;padding:26px;border-radius:16px;width:min(560px,100%);max-height:90vh;overflow-y:auto}.error{color:#b42c42;font-size:12px}.wr-chart{min-height:110px}.bar{height:20px;border-radius:5px;background:#eaf3ff;overflow:hidden;margin:8px 0 14px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#1266f5,#63cbf5)}.badge-status{padding:4px 8px;background:#eaf3ff;border-radius:8px}.app-link{color:#1266f5;text-decoration:none}.avatar{flex-shrink:0}.signed{font-size:11px;color:#5a708e;max-width:170px;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;bottom:25px;right:25px;z-index:200;background:#102e5c;color:#fff;border-radius:10px;padding:12px 18px;box-shadow:0 10px 30px #1234}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.wr-grid,.wr-bottom{grid-template-columns:1fr!important}}@media(max-width:560px){.kpis{grid-template-columns:1fr!important}}</style></head><body><div class="app"><aside class="sidebar"><a class="brand" href="index.html" aria-label="WorkRelief workspace"><img src="../assets/img/logo.png" alt="workrelief"></a><div class="workspace" id="workspaceLabel">Your workspace</div><nav class="nav" id="nav"><button data-page="dashboard" class="on"><i>⌂</i> Dashboard</button><button data-page="leads"><i>♙</i> Leads</button><button data-page="contacts"><i>♧</i> Contacts</button><button data-page="companies"><i>▥</i> Companies</button><button data-page="pipeline"><i>◉</i> Deals</button><button data-page="tasks"><i>☑</i> Tasks</button><button data-page="activities"><i>▣</i> Activities</button><button data-page="reports"><i>▥</i> Reports</button><button data-page="settings"><i>⚙</i> Settings</button><button id="backApps"><i>✧</i> Connected apps</button></nav><div class="bottom"><b>Get more from<br>workrelief CRM</b><p>All your customer records in one connected workspace.</p><a href="index.html" class="app-link">Your applications →</a></div></aside><main class="main"><header class="top"><div class="right"><input id="search" class="search" placeholder="⌕  Search contacts, companies, deals, or anything…" aria-label="Search CRM"><button class="btn" id="newButton">＋ New</button><div class="avatar" id="avatar">WR</div><span class="signed" id="emailLabel"></span><button class="btn" id="logout" title="Sign out">↪</button></div></header><div id="content" class="content"><div class="loading">Connecting to your workspace…</div></div></main></div><div id="modal" class="modal" hidden><div class="dialogbox"><div class="headrow"><h2 id="modalTitle">New record</h2><button id="closeModal" class="btn">× Close</button></div><form id="editForm"><div id="fields" class="formgrid"></div><p id="formError" class="error"></p><div class="headrow" style="justify-content:flex-end;margin-top:20px"><button type="button" id="cancel" class="btn">Cancel</button><button class="minibutton" id="saveButton">Save record</button></div></form></div></div><div id="toast" class="toast" hidden></div><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const sb=createClient('https://cqzwoskpgefacghdnuyz.supabase.co','sb_publishable_CoIoX7Pinqd2o4kJwqCTqA_RKmePPZt');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
const fmt=d=>d?new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
const stages=[['new','New Lead'],['qualified','Qualified'],['proposal','Proposal'],['negotiation','Negotiation'],['won','Won']];
let user=null,workspace=null,memberRole='member',contacts=[],deals=[],activities=[],page='dashboard',search='',busy=false;
function notify(message){const e=$('toast');e.textContent=message;e.hidden=false;setTimeout(()=>e.hidden=true,3500)}
function selectedPage(p){page=p;history.replaceState({},'', '#'+p);document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===p));render()}
function section(title,action='',actionPage=''){return `<div class="wr-panelhead"><h2>${title}</h2>${action?`<button data-goto="${actionPage}">${action} →</button>`:''}</div>`}
function header(title,subtitle='',action='',kind=''){return `<div class="heading"><div><div class="eyebrow">WELCOME TO WORKRELIEF CRM</div><h1>${title}</h1>${subtitle?`<p class="quiet">${subtitle}</p>`:''}</div>${action?`<button class="minibutton" data-new="${kind}">${action}</button>`:''}</div>`}
function metrics(){const open=deals.filter(x=>!['won','lost'].includes(x.stage)),total=open.reduce((n,d)=>n+Number(d.amount||0),0),won=deals.filter(x=>x.stage==='won'),wonVal=won.reduce((n,d)=>n+Number(d.amount||0),0),tasks=activities.filter(a=>a.kind==='task'&&!a.completed).length,closed=deals.filter(d=>['won','lost'].includes(d.stage)).length,rate=closed?Math.round(won.length/closed*100):0;return {total,wonVal,tasks,rate,open,won}}
function board(preview=true){return `<div class="wr-board" style="display:grid;grid-template-columns:repeat(5,minmax(155px,1fr));gap:7px;overflow:auto">${stages.map(([stage,label],idx)=>{const list=deals.filter(d=>d.stage===stage);return `<div class="lane" style="border-radius:10px;background:${['#eef5ff','#eef4fd','#f3efff','#fff6e9','#eafbf3'][idx]};padding:9px;min-height:240px" data-stage="${stage}"><div style="font-size:12px;font-weight:800;color:${['#145da7','#1463de','#7650d4','#bd750d','#0c985b'][idx]}">${label}</div><div class="quiet" style="margin:4px 0 12px">${list.length} deals · ${money(list.reduce((n,d)=>n+Number(d.amount||0),0))}</div>${list.slice(0,preview?4:999).map(d=>{const c=contacts.find(c=>c.id===d.contact_id);return `<div class="dashitem" draggable="true" data-drag="${d.id}" data-edit-deal="${d.id}"><strong>${esc(c?.company||d.title)}</strong><small style="color:#11264b;font-weight:750">${money(d.amount)}</small><small>${esc(c?.name||d.title)}</small></div>`}).join('')}${list.length===0?'<div class="quiet" style="padding:8px 2px">No deals yet</div>':''}</div>`}).join('')}</div>`}
function dashboard(){const m=metrics(),upcoming=activities.filter(x=>!x.completed&&x.due_at).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at)).slice(0,4),recent=[...activities].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,5);
const stat=(icon,label,val,note,bg)=>`<div class="wr-section" style="display:flex;align-items:center;gap:14px;padding:23px 16px"><div style="width:52px;height:52px;flex:none;border-radius:14px;background:${bg};display:grid;place-items:center;color:#1473fa;font-size:24px">${icon}</div><div><div class="quiet">${label}</div><div style="font-size:25px;font-weight:850;letter-spacing:-.8px;color:#07183c">${val}</div><small class="quiet">${note}</small></div></div>`;
return `<div class="heading" style="align-items:center"><div><div class="eyebrow">WELCOME TO WORKRELIEF CRM</div><h1>Here’s what’s happening with your business today.</h1></div><span class="chip">▣ &nbsp; ${esc(new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}))}</span></div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px" class="kpis">${stat('▥','Pipeline Value',money(m.total),`${m.open.length} open deals`,'#eaf2ff')}${stat('♕','Total Won',money(m.wonVal),'All-time closed won','#e7faf4')}${stat('◉','Open Tasks',m.tasks,'Follow-ups and reminders','#eaf3ff')}${stat('◷','Win Rate',m.rate+'%','Won / closed deals','#f1efff')}</div><div class="wr-grid" style="display:grid;grid-template-columns:minmax(0,3fr) minmax(275px,1fr);gap:15px"><section class="wr-section">${section('Deals Pipeline','View all','pipeline')}<div style="display:flex;justify-content:flex-end"><small class="quiet">Total open: ${money(m.total)}</small></div>${board()}</section><aside class="wr-side"><section class="wr-section">${section('Upcoming Activities','View all','activities')}${upcoming.length?upcoming.map(a=>`<div class="dashitem" data-edit-activity="${a.id}"><strong>${esc(a.title)}</strong><small>${fmt(a.due_at)} · ${esc(a.kind)}</small></div>`).join(''):'<div class="empty-note">No upcoming activities. <a class="app-link" href="#tasks" data-goto="tasks">Add a follow-up →</a></div>'}</section><section class="wr-section">${section('Recent Customer Updates','View all','activities')}${recent.length?recent.slice(0,3).map(a=>`<div class="dashitem" data-edit-activity="${a.id}"><strong>${esc(a.title)}</strong><small>${fmt(a.created_at)}</small></div>`).join(''):'<div class="empty-note">Customer updates appear when you log activities.</div>'}</section></aside></div><div class="wr-bottom" style="display:grid;grid-template-columns:1.1fr 1fr;gap:15px;margin-top:16px"><section class="wr-section">${section('Pipeline Value by Stage','View all','reports')}${stages.map(([s,label])=>{const sum=deals.filter(d=>d.stage===s).reduce((n,d)=>n+Number(d.amount||0),0);return `<div class="quiet">${label} · ${money(sum)}</div><div class="bar"><span style="width:${m.total?Math.min(100,Math.round(sum/m.total*100)):0}%"></span></div>`}).join('')}</section><section class="wr-section">${section('Recent Activity','View all','activities')}${recent.length?recent.map(a=>`<div class="dashitem" data-edit-activity="${a.id}"><strong>${esc(a.title)}</strong><small>${esc(a.kind)} · ${fmt(a.created_at)}</small></div>`).join(''):'<div class="empty-note">No activities yet. Log a call, meeting, note, or task to see updates.</div>'}</section></div>`}
function contactsView(leads=false){const list=contacts.filter(c=>leads?c.status==='lead':true).filter(c=>[c.name,c.company,c.email].some(x=>String(x||'').toLowerCase().includes(search)));return header(leads?'Leads':'Contacts',leads?'Manage new business inquiries and convert them to customers.':'Your shared customer and contact directory.','+ New '+(leads?'lead':'contact'),'contact')+`<section class="wr-section"><div class="headrow"><h2>${leads?'Sales leads':'All contacts'} <span class="quiet">(${list.length})</span></h2></div><div style="overflow-x:auto"><table class="records"><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.company)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td><span class="chip">${esc(c.status)}</span></td><td><button class="btn" data-edit-contact="${c.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>${!list.length?'<div class="empty-note">No records yet. Add your first contact to get started.</div>':''}</section>`}
function companiesView(){const map=new Map;for(const c of contacts){if(!c.company)continue;const key=c.company.toLowerCase();if(!map.has(key))map.set(key,{name:c.company,list:[]});map.get(key).list.push(c)}const list=[...map.values()].filter(x=>x.name.toLowerCase().includes(search));return header('Companies','Accounts derived from your live contacts.','+ New contact','contact')+`<section class="wr-section"><table class="records"><thead><tr><th>Company</th><th>Contacts</th><th>Open Deals</th></tr></thead><tbody>${list.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${x.list.length}</td><td>${deals.filter(d=>x.list.some(c=>c.id===d.contact_id)&&!['won','lost'].includes(d.stage)).length}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty-note">Companies will appear when you associate them with contacts.</div>':''}</section>`}
function pipelineView(){return header('Deals & Pipeline','Move opportunities through your sales process.','+ New deal','deal')+`<section class="wr-section">${board(false)}</section>`}
function activitiesView(tasks=false){const list=activities.filter(a=>tasks?a.kind==='task':true).filter(a=>[a.title,a.kind,a.notes].some(x=>String(x||'').toLowerCase().includes(search))).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return header(tasks?'Tasks':'Activities',tasks?'Keep follow-ups moving.':'Calls, meetings, notes, and follow-up tasks.','+ New '+(tasks?'task':'activity'),'activity')+`<section class="wr-section"><table class="records"><thead><tr><th>Activity</th><th>Type</th><th>Due date</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(a=>`<tr><td><strong>${esc(a.title)}</strong></td><td>${esc(a.kind)}</td><td>${fmt(a.due_at)}</td><td><span class="chip">${a.completed?'Completed':'Open'}</span></td><td><button class="btn" data-edit-activity="${a.id}">Edit</button></td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty-note">No activities here yet. Create a follow-up to get started.</div>':''}</section>`}
function reportsView(){const m=metrics();return header('Reports','Metrics calculated from live WorkRelief records.')+`<div style="display:grid;grid-template-columns:1fr 1fr;gap:15px"><section class="wr-section">${section('Pipeline by stage')}${stages.map(([s,label])=>{const n=deals.filter(d=>d.stage===s).reduce((x,d)=>x+Number(d.amount||0),0);return `<div class="quiet">${label} · ${money(n)}</div><div class="bar"><span style="width:${m.total?Math.round(n/m.total*100):0}%"></span></div>`}).join('')}</section><section class="wr-section">${section('Performance snapshot')}<table class="records"><tbody><tr><td>Open pipeline</td><td>${money(m.total)}</td></tr><tr><td>Total won</td><td>${money(m.wonVal)}</td></tr><tr><td>Win rate</td><td>${m.rate}%</td></tr><tr><td>Contacts</td><td>${contacts.length}</td></tr><tr><td>Outstanding tasks</td><td>${m.tasks}</td></tr></tbody></table></section></div>`}
function settingsView(){return header('CRM Settings','Your organization, access, and workspace settings.')+`<section class="wr-section"><h2>${esc(workspace.name)}</h2><p class="quiet">Account: ${esc(user.email)} · Role: ${esc(memberRole)}</p><p class="quiet">Your data is stored in your existing WorkRelief Supabase workspace.</p><p><a class="app-link" href="index.html">Return to connected applications →</a></p></section>`}
function render(){if(!workspace)return;const views={dashboard,leads:()=>contactsView(true),contacts:()=>contactsView(false),companies:companiesView,pipeline:pipelineView,tasks:()=>activitiesView(true),activities:()=>activitiesView(false),reports:reportsView,settings:settingsView};$('content').innerHTML=(views[page]||dashboard)();document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();selectedPage(el.dataset.goto)}));document.querySelectorAll('[data-new]').forEach(el=>el.onclick=()=>openForm(el.dataset.new));document.querySelectorAll('[data-edit-contact]').forEach(el=>el.onclick=()=>openForm('contact',el.dataset.editContact));document.querySelectorAll('[data-edit-deal]').forEach(el=>el.onclick=()=>openForm('deal',el.dataset.editDeal));document.querySelectorAll('[data-edit-activity]').forEach(el=>el.onclick=()=>openForm('activity',el.dataset.editActivity));document.querySelectorAll('[data-drag]').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.drag)));document.querySelectorAll('[data-stage]').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=async e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(!deals.some(d=>d.id===id))return;try{await write(()=>sb.from('crm_deals').update({stage:el.dataset.stage}).eq('id',id).eq('workspace_id',workspace.id));notify('Deal stage updated');await reload()}catch(e){notify(e.message)}}});}
async function write(f){const {data,error}=await f();if(error)throw error;return data}
async function reload(){const results=await Promise.all([sb.from('crm_contacts').select('*').eq('workspace_id',workspace.id).order('created_at',{ascending:false}).limit(1000),sb.from('crm_deals').select('*').eq('workspace_id',workspace.id).order('created_at',{ascending:false}).limit(1000),sb.from('crm_activities').select('*').eq('workspace_id',workspace.id).order('created_at',{ascending:false}).limit(1000)]);for(const r of results)if(r.error)throw r.error;[contacts,deals,activities]=results.map(x=>x.data||[]);render()}
function openForm(kind,id){const record=({contact:contacts,deal:deals,activity:activities}[kind]||[]).find(x=>x.id===id)||{};$('modalTitle').textContent=(id?'Edit ':'New ')+kind;$('modal').hidden=false;$('formError').textContent='';const input=(name,label,type='text',value='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${name==='name'||name==='title'?'required':''}></label>`;
let html='';if(kind==='contact'){html=input('name','Full name','text',record.name)+input('email','Email','email',record.email)+input('phone','Phone','tel',record.phone)+input('company','Company','text',record.company)+`<label>Status<select name="status">${['lead','prospect','customer','inactive'].map(s=>`<option value="${s}" ${record.status===s||(!record.status&&s==='lead')?'selected':''}>${s}</option>`).join('')}</select></label><label class="wide">Notes<textarea name="notes" rows="3">${esc(record.notes)}</textarea></label>`}
else if(kind==='deal'){html=input('title','Deal title','text',record.title)+input('amount','Amount','number',record.amount??0)+`<label>Stage<select name="stage">${[...stages,['lost','Lost']].map(([s,label])=>`<option value="${s}" ${record.stage===s?'selected':''}>${label}</option>`).join('')}</select></label><label>Contact<select name="contact_id"><option value="">No contact</option>${contacts.map(c=>`<option value="${c.id}" ${record.contact_id===c.id?'selected':''}>${esc(c.name)} · ${esc(c.company)}</option>`).join('')}</select></label>`+input('expected_close','Expected close','date',record.expected_close)+`<label class="wide">Notes<textarea name="notes" rows="3">${esc(record.notes)}</textarea></label>`}
else{html=input('title','Activity title','text',record.title)+`<label>Type<select name="kind">${['task','call','meeting','note'].map(s=>`<option value="${s}" ${record.kind===s?'selected':''}>${s}</option>`).join('')}</select></label>`+input('due_at','Due date and time','datetime-local',record.due_at?new Date(record.due_at).toISOString().slice(0,16):'')+`<label>Contact<select name="contact_id"><option value="">No contact</option>${contacts.map(c=>`<option value="${c.id}" ${record.contact_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Completed<select name="completed"><option value="false" ${!record.completed?'selected':''}>No</option><option value="true" ${record.completed?'selected':''}>Yes</option></select></label><label class="wide">Notes<textarea name="notes" rows="3">${esc(record.notes)}</textarea></label>`}
$('fields').innerHTML=html;$('editForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('saveButton').disabled=true;try{const v=Object.fromEntries(new FormData(e.target));for(const key of ['contact_id'])if(key in v&&!v[key])v[key]=null;if('amount'in v)v.amount=Number(v.amount);if('completed'in v)v.completed=v.completed==='true';if('due_at'in v)v.due_at=v.due_at?new Date(v.due_at).toISOString():null;if('expected_close'in v&&!v.expected_close)v.expected_close=null;v.workspace_id=workspace.id;if(!id)v.created_by=user.id;const table={contact:'crm_contacts',deal:'crm_deals',activity:'crm_activities'}[kind];await write(()=>id?sb.from(table).update(v).eq('id',id).eq('workspace_id',workspace.id):sb.from(table).insert(v));$('modal').hidden=true;notify('Record saved');await reload()}catch(err){$('formError').textContent=err.message||'Unable to save record'}finally{busy=false;$('saveButton').disabled=false}}}
function closeModal(){$('modal').hidden=true}
$('closeModal').onclick=closeModal;$('cancel').onclick=closeModal;
$('newButton').onclick=()=>openForm(page==='pipeline'?'deal':page==='tasks'||page==='activities'?'activity':'contact');
$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('../login.html')};
$('backApps').onclick=()=>location.assign('index.html');
$('nav').querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>selectedPage(el.dataset.page));
$('search').oninput=e=>{search=e.target.value.toLowerCase().trim();if(search&&!['contacts','leads','companies','pipeline','tasks','activities'].includes(page))selectedPage('contacts');else render()};
async function start(){try{const r=await sb.auth.getUser();if(r.error||!r.data.user){location.replace('../login.html?next=app/crm.html');return}user=r.data.user;$('emailLabel').textContent=user.email;$('avatar').textContent=(user.email||'W').slice(0,2).toUpperCase();const members=await sb.from('workspace_members').select('workspace_id,role').limit(1);if(members.error)throw members.error;if(!members.data?.length){$('content').innerHTML=`<section class="no-access"><h2>Create your workspace</h2><p>Set up your company to access WorkRelief CRM.</p><form id="setup"><label>Company name<input name="name" required maxlength="160" style="display:block;width:100%;padding:12px;margin:10px 0"></label><button class="minibutton">Create workspace</button><p id="setupError" class="error"></p></form></section>`;$('setup').onsubmit=async e=>{e.preventDefault();try{await write(()=>sb.rpc('create_personal_workspace',{company_name:new FormData(e.target).get('name')}));location.reload()}catch(error){$('setupError').textContent=error.message}};return}memberRole=members.data[0].role;const wr=await sb.from('workspaces').select('id,name').eq('id',members.data[0].workspace_id).single();if(wr.error)throw wr.error;workspace=wr.data;$('workspaceLabel').textContent=workspace.name;const initial=location.hash.slice(1);page=['dashboard','leads','contacts','companies','pipeline','tasks','activities','reports','settings'].includes(initial)?initial:'dashboard';document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('on',el.dataset.page===page));await reload()}catch(e){$('content').innerHTML=`<section class="no-access"><h2>Unable to load CRM</h2><p class="error">${esc(e.message||'Connection error')}</p><button class="minibutton" id="retry">Retry</button></section>`;$('retry').onclick=start}}
start();
</script></body></html>
