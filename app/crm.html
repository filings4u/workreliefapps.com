/* CRM sidebar visibility and account controls — preserve existing navigation. */
.sidebar{height:100dvh;max-height:100dvh;overflow:hidden;min-height:0}
.sidebar .nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#cbd8ea transparent;padding-right:3px}
.sidebar .bottom{flex:0 0 auto;margin-top:0;max-height:150px;overflow:auto}
.sidebar .wr-account{flex:0 0 auto;padding:14px 0 5px;border-top:1px solid #e8edf5;background:#fff}
.wr-account-email{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#667995;padding:0 8px 8px}
.wr-signout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;border:1px solid #1254e4;background:#1461fa;color:#fff;border-radius:11px;font-weight:750;text-align:center;padding:11px 14px;cursor:pointer;box-shadow:0 4px 12px #1461fa25}
.wr-signout:hover,.wr-signout:focus-visible{background:#084bd2;outline:2px solid #b2caff;outline-offset:2px}
.wr-signout:disabled{opacity:.65;cursor:wait}
@media(max-width:950px){.sidebar .wr-account{padding:8px 0}.wr-account-email{display:none}.wr-signout{font-size:0;padding:10px 2px}.wr-signout::before{content:'⇥';font-size:22px}.sidebar .bottom{display:none}}
@media(max-width:700px){.sidebar{display:none}.wr-mobile-signout{display:inline-flex!important}}
.wr-mobile-signout{display:none;border:1px solid #1254e4;border-radius:9px;background:#1461fa;color:white;padding:8px 10px;font-weight:700}

.wr-mobile-backdrop{display:none}
@media(max-width:700px){
 .sidebar.wr-open{display:flex!important;position:fixed;left:0;top:0;height:100dvh;max-height:100dvh;width:min(290px,84vw);min-width:0;z-index:1001;box-shadow:10px 0 40px #102b4b33}
 .sidebar.wr-open .nav button{font-size:13px;justify-content:flex-start;padding:11px 14px}
 .sidebar.wr-open .nav button i{font-size:20px}
 .sidebar.wr-open .wr-account{display:block}
 .sidebar.wr-open .wr-signout{font-size:13px;text-align:left;padding:10px 12px}
 .sidebar.wr-open .wr-signout::before{content:none}
 .wr-mobile-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:1000;background:#0d234477}
 .top .mobile{display:inline-flex!important;align-items:center;justify-content:center}
}

an class="dot">◇</span><div style="flex:1"><b>${safe(d.title)}</b><small>${safe(d.company)}</small></div><strong>${money(d.value)}</strong></div>`).join('')}</section><section class="panel"><div class="panelhead"><h3>Recently added contacts</h3><button class="smalllink" onclick="go('contacts')">See all →</button></div>${contacts.slice(-4).reverse().map(c=>`<div class="activity"><span class="face">${safe(c.name.charAt(0))}</span><div><b>${safe(c.name)}</b><small>${safe(c.company)}</small></div></div>`).join('')}</section></div>`}
function contactTable(list){return `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr data-id="${c.id}" onclick="detail(${c.id})"><td><span class="face">${safe(c.name.charAt(0))}</span><b style="display:inline">${safe(c.name)}</b></td><td>${safe(c.company)}</td><td>${safe(c.email)}</td><td>${safe(c.phone)}</td><td><span class="pill ${c.status==='Lead'?'warn':'blue'}">${safe(c.status)}</span></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No matching records</td></tr>`}</tbody></table></div>`}function contactPage(onlyLeads=false){let list=contacts.filter(c=>(onlyLeads?c.status==='Lead':c.status!=='Lead')&&JSON.stringify(c).toLowerCase().includes(query));return header(onlyLeads?'Leads':'Contacts',onlyLeads?'People who may become your customers.':'Converted contacts in one connected place.')+`<div class="toolbar"><span class="sub">${list.length} records • Click a contact to view details</span><button class="filter" onclick="document.getElementById('search').focus()">⌕ Search & filter</button></div>`+contactTable(list)}
function companies(){const cs=[...new Set(contacts.map(c=>c.company))].filter(c=>c.toLowerCase().includes(query));return header('Companies','One company profile connects contacts and opportunities.')+`<div class="tablewrap"><table><thead><tr><th>Company</th><th>Contacts</th><th>Pipeline value</th><th>Relationship</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${safe(c)}</b></td><td>${contacts.filter(x=>x.company===c).length}</td><td>${money(deals.filter(x=>x.company===c).reduce((a,d)=>a+d.value,0))}</td><td><span class="pill blue">Active record</span></td></tr>`).join('')}</tbody></table></div>`}
function pipeline(){return header('Sales pipeline','See every opportunity clearly and move deals through your sales process.','New deal')+`<div class="toolbar"><div class="sub">Drag a deal between stages • Changes sync to your workspace</div></div><div class="kanban">${stages.map(s=>{let list=deals.filter(d=>d.stage===s&&JSON.stringify(d).toLowerCase().includes(query));return `<div class="lane" data-stage="${s}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropDeal(event,this)"><div class="lanehead"><span>${s} <small>(${list.length})</small></span><small>${money(list.reduce((a,d)=>a+d.value,0))}</small></div>${list.map(d=>`<div class="deal" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${d.id}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="dealDetail(${d.id})"><h4>${safe(d.title)}</h4><p>${safe(d.company)}</p><div class="dealfooter"><span>${money(d.value)}</span><span style="color:#8895a9">↗</span></div></div>`).join('')}</div>`}).join('')}</div>`}
function dropDeal(e,el){e.preventDefault();el.classList.remove('over');let d=deals.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(d){d.stage=el.dataset.stage;save();render()}}
function activities(){return header('Activities','All follow-ups, calls, meetings, and tasks in one view.')+`<section class="panel"><h3>Your activity workspace</h3><p class="sub">Only activities saved to your authorized workspace are shown.</p>${deals.filter(d=>d.stage==='Proposal'||d.stage==='Negotiation').map(d=>`<div class="activity"><span class="dot">◷</span><div style="flex:1"><b>Check in: ${safe(d.company)}</b><small>${safe(d.title)} • ${safe(d.stage)}</small></div><button class="btn" onclick="dealDetail(${d.id})">Open</button></div>`).join('')}</section>`}function reports(){let won=deals.filter(d=>d.stage==='Won').reduce((a,d)=>a+d.value,0),all=deals.reduce((a,d)=>a+d.value,0);return header('Reports','Understand pipeline health and team performance.')+`<div class="stats">${stat('Total deal value',money(all),'All stages')}${stat('Won value',money(won),'Closed-won')}${stat('Open opportunities',deals.filter(d=>d.stage!=='Won').length,'Across active stages')}${stat('Contacts',contacts.length,'Relationship records')}</div><div class="dashboard-grid"><section class="panel"><h3>Stage breakdown</h3>${stages.map(s=>`<div class="barrow"><span class="stage">${s}</span><div class="bar"><div class="fill" style="width:${deals.length?deals.filter(d=>d.stage===s).length/deals.length*100:0}%"></div></div><strong>${deals.filter(d=>d.stage===s).length}</strong></div>`).join('')}</section><section class="panel"><h3>Not connected</h3><div class="activity"><span class="dot">▥</span><div><b>Revenue forecasting</b><small>Probability-weighted projections</small></div></div><div class="activity"><span class="dot">◎</span><div><b>Conversion analytics</b><small>Win rates and stage velocity</small></div></div><div class="activity"><span class="dot">◇</span><div><b>Team dashboards</b><small>Role-specific reporting</small></div></div></section></div>`}
function apps(){return header('Connected apps','Integration status is shown below; unavailable services are not connected.')+`<div class="stats">${[['▣','WorkRelief Billing'],['◷','WorkRelief Scheduling'],['☷','WorkRelief Projects'],['☑','WorkRelief Tasks'],['▤','WorkRelief Docs'],['✧','WorkRelief Workflow'],['◉','WorkRelief Desk'],['✦','WorkRelief AI']].map(([i,n])=>`<div class="stat"><div style="font-size:27px;color:#4968de">${i}</div><h3>${n}</h3><div class="sub">Planned platform integration</div><div style="margin-top:17px"><span class="pill blue">Not connected</span></div></div>`).join('')}</div>`}
function render(){document.getElementById('crumb').textContent=title(page);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));document.getElementById('content').innerHTML=({dashboard,leads:()=>contactPage(true),contacts:()=>contactPage(),companies,pipeline,activities,reports,apps})[page]()}function go(p){page=p;query='';document.getElementById('search').value='';render()}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();if(page==='dashboard'&&query)page='contacts';render()});function cyclePage(){let p=['dashboard','leads','contacts','companies','pipeline','activities','reports','apps'];go(p[(p.indexOf(page)+1)%p.length])}
function openDrawer(html){document.getElementById('drawer').innerHTML='<button class="x" onclick="closeDrawer()">✕</button>'+html;document.getElementById('back').classList.add('show')}function closeDrawer(){document.getElementById('back').classList.remove('show')}function openNew(kind){kind=kind||(page==='pipeline'?'deal':'contact');if(kind==='deal'){openDrawer(`<div class="eyebrow">SALES PIPELINE</div><h2>Create new deal</h2><p>Add an opportunity to the pipeline.</p><form onsubmit="createDeal(event)" class="formgrid"><div class="field"><label>Deal name</label><input name="title" required placeholder="New service agreement"></div><div class="field"><label>Company</label><input name="company" required placeholder="Company name"></div><div class="field"><label>Value (USD)</label><input type="number" name="value" min="0" required placeholder="10000"></div><div class="field"><label>Stage</label><select name="stage">${stages.map(s=>`<option>${s}</option>`).join('')}</select></div><button class="btn primary" type="submit">Create deal</button></form>`)}else{openDrawer(`<div class="eyebrow">RELATIONSHIPS</div><h2>Add a contact</h2><p>Build your customer database.</p><form onsubmit="createContact(event)" class="formgrid"><div class="field"><label>Full name</label><input name="name" required placeholder="Taylor Smith"></div><div class="field"><label>Company</label><input name="company" required placeholder="Company name"></div><div class="field"><label>Email</label><input type="email" name="email" placeholder="name@company.com"></div><div class="field"><label>Phone</label><input name="phone" placeholder="(555) 555-0100"></div><div class="field"><label>Relationship status</label><select name="status"><option>Lead</option><option>Prospect</option><option>Customer</option></select></div><button class="btn primary" type="submit">Save contact</button></form>`)}}
function createContact(e){e.preventDefault();let f=new FormData(e.target);contacts.unshift({id:Date.now(),...Object.fromEntries(f)});save();closeDrawer();go('contacts')}function createDeal(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));deals.unshift({id:Date.now(),...f,value:Number(f.value)});save();closeDrawer();go('pipeline')}function detail(id){let c=contacts.find(c=>c.id===id);if(!c)return;openDrawer(`<div class="eyebrow">CONTACT PROFILE</div><div class="clienthead"><span class="face">${safe(c.name[0])}</span><div><h2>${safe(c.name)}</h2><div class="sub">${safe(c.company)}</div></div></div><span class="pill blue">${safe(c.status)}</span><div class="note"><b>Contact details</b><p>${safe(c.email||'No email')}<br>${safe(c.phone||'No phone')}</p></div><h3>Linked opportunities</h3>${deals.filter(d=>d.company===c.company).map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(d.value)} • ${safe(d.stage)}</small></div></div>`).join('')||'<p>No linked deals yet</p>'}<h3>Customer timeline</h3>${contactTimeline(c)}<button class="btn primary" onclick="closeDrawer();openNew('deal')">＋ Create opportunity</button>`)}function contactTimeline(c){
 const key=(c.company||'').trim().toLowerCase();
 const entries=wrNotes.filter(a=>key && (a.related||'').trim().toLowerCase()===key).sort((a,b)=>new Date(b.created||0)-new Date(a.created||0));
 if(!entries.length)return '<div class="note">No activities logged for this account yet.</div>';
 return entries.map(a=>`<div class="activity"><span class="dot">◷</span><div><b>${safe(a.type||'Activity')} · ${safe(a.subject||'Untitled')}</b><small>${safe(a.created||'')}</small>${a.notes?`<p>${safe(a.notes)}</p>`:''}</div></div>`).join('');
}
function dealDetail(id){let d=deals.find(x=>x.id===id);if(!d)return;openDrawer(`<div class="eyebrow">DEAL DETAILS</div><h2>${safe(d.title)}</h2><p>${safe(d.company)}</p><div class="note"><b>Opportunity value</b><div style="font-size:28px;font-weight:800">${money(d.value)}</div></div><div class="field"><label>Stage</label><select onchange="moveDeal(${d.id},this.value)">${stages.map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select></div><div class="note"><b>Next step</b><p>Plan a follow-up, appointment, or proposal for this customer.</p></div><button class="btn primary" onclick="newTask('${safe(d.company).replaceAll("'","&#39;")}')">+ Create follow-up</button>`)}function moveDeal(id,s){let d=deals.find(x=>x.id===id);d.stage=s;save();render()}function resetDemo(){}render();</script>
<script>
/* WorkRelief CRM: UI state is hydrated from workspace-scoped Supabase records after authentication. */
let wrLeads=[];
let wrTasks=[];
let wrNotes=[];
let wrCompanies=[];
let wrPreferences={workspace:'Workspace',currency:'USD'};
const nextId=()=>Date.now()+Math.floor(Math.random()*10000);
function saveV2(){/* Server writes only; browser storage is not a CRM database. */}
function toast(message){let el=document.getElementById('wr-toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
const originalTitle=title;
title=function(p){return ({tasks:'My Work',settings:'Settings'})[p]||originalTitle(p)};
const originalRender=render;
render=function(){if(!document.getElementById('content'))return;document.getElementById('crumb').textContent=title(page);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));let views={dashboard,leads:leadPage,contacts:()=>contactPage(false),companies:companyPage,pipeline,activities:activityPage,reports,apps,tasks:taskPage,settings:settingsPage};document.getElementById('content').innerHTML=(views[page]||dashboard)()};
function toolbarButtons(items){return `<div class="toolbar"><div class="actions">${items.join('')}</div></div>`}
function leadPage(){let list=wrLeads.filter(x=>JSON.stringify(x).toLowerCase().includes(query));return header('Leads','Qualify inquiries and convert them into customer records.','New lead').replace("openNew('contact')","newLead()")+toolbarButtons([`<span class="sub">${list.length} leads</span>`,`<button class="action-quiet" onclick="exportCSV('leads')">↓ Export CSV</button>`])+`<div class="tablewrap"><table><thead><tr><th>Lead</th><th>Company</th><th>Source</th><th>Status</th><th>Next action</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${safe(x.name)}</b><small style="display:block;color:#8390a4">${safe(x.email)}</small></td><td>${safe(x.company)}</td><td>${safe(x.source)}</td><td><span class="pill blue">${safe(x.status)}</span></td><td><button class="record-btn" onclick="leadDetail(${x.id})">Open →</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty-note">No leads found</td></tr>'}</tbody></table></div>`}
function newLead(){openDrawer(`<div class="eyebrow">LEAD MANAGEMENT</div><h2>New lead</h2><p>Capture a potential customer.</p><form class="formgrid" onsubmit="addLead(event)"><div class="field"><label>Full name</label><input name="name" required maxlength="120"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Company</label><input name="company" required maxlength="150"></div><div class="field"><label>Source</label><select name="source"><option>Website</option><option>Referral</option><option>Event</option><option>Outbound</option><option>Other</option></select></div><button class="btn primary">Save lead</button></form>`)}
function addLead(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));wrLeads.unshift({id:nextId(),...x,status:'New'});saveV2();closeDrawer();go('leads');toast('Lead created')}
function leadDetail(id){let x=wrLeads.find(a=>a.id===id);if(!x)return;openDrawer(`<div class="eyebrow">LEAD</div><h2>${safe(x.name)}</h2><p>${safe(x.company)} · ${safe(x.email)}</p><div class="field"><label>Lead status</label><select onchange="updateLead(${id},this.value)">${['New','Contacted','Qualified','Disqualified'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" onclick="convertLead(${id})">Convert to contact</button><button class="action-quiet" onclick="newTask('${safe(x.company).replaceAll("'",'&#39;')}')">+ Follow-up</button></div>`)}
function updateLead(id,status){let x=wrLeads.find(x=>x.id===id);if(x){x.status=status;saveV2();render();toast('Lead updated')}}
function convertLead(id){let x=wrLeads.find(x=>x.id===id);if(!x)return;if(!confirm('Convert this lead into a contact?'))return;let pieces=x.name.trim().split(/\s+/);contacts.unshift({id:nextId(),name:x.name,company:x.company,email:x.email,phone:'',status:'Prospect'});wrLeads=wrLeads.filter(a=>a.id!==id);saveV2();closeDrawer();go('contacts');toast('Lead converted to contact')}
function companyPage(){let names=[...new Set([...wrCompanies.map(x=>x.name),...contacts.map(x=>x.company),...deals.map(x=>x.company)].filter(Boolean))].filter(x=>x.toLowerCase().includes(query));return header('Companies','Keep customer accounts and their relationships together.','New company').replace("openNew('contact')","newCompany()")+toolbarButtons([`<span class="sub">${names.length} company records</span>`,`<button class="action-quiet" onclick="exportCSV('companies')">↓ Export CSV</button>`])+`<div class="tablewrap"><table><thead><tr><th>Company</th><th>Contacts</th><th>Deals</th><th>Open pipeline</th><th></th></tr></thead><tbody>${names.map(n=>`<tr><td><b>${safe(n)}</b></td><td>${contacts.filter(x=>x.company===n).length}</td><td>${deals.filter(x=>x.company===n).length}</td><td>${money(deals.filter(x=>x.company===n&&x.stage!=='Won').reduce((a,x)=>a+x.value,0))}</td><td><button class="record-btn" onclick="companyDetail(${JSON.stringify(n).replace(/"/g,'&quot;')})">View →</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty-note">No companies</td></tr>'}</tbody></table></div>`}
function newCompany(){openDrawer(`<div class="eyebrow">ACCOUNT</div><h2>New company</h2><form class="formgrid" onsubmit="addCompany(event)"><div class="field"><label>Company name</label><input name="name" required maxlength="150"></div><div class="field"><label>Industry</label><input name="industry"></div><div class="field"><label>Website</label><input name="website" type="url" placeholder="https://"></div><button class="btn primary">Save company</button></form>`)}
function addCompany(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(wrCompanies.some(c=>c.name.toLowerCase()===x.name.toLowerCase())){toast('Company already exists');return}wrCompanies.push({id:nextId(),...x});saveV2();closeDrawer();go('companies');toast('Company created')}
function companyDetail(name){let cs=contacts.filter(x=>x.company===name),ds=deals.filter(x=>x.company===name);openDrawer(`<div class="eyebrow">ACCOUNT PROFILE</div><h2>${safe(name)}</h2><p>${cs.length} contacts · ${ds.length} opportunities</p><h3>Contacts</h3>${cs.map(c=>`<div class="activity"><span class="face">${safe(c.name[0])}</span><div><b>${safe(c.name)}</b><small>${safe(c.email)}</small></div></div>`).join('')||'<p class="sub">No contacts yet.</p>'}<h3>Deals</h3>${ds.map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(d.value)} · ${safe(d.stage)}</small></div></div>`).join('')||'<p class="sub">No deals yet.</p>'}<button class="btn primary" onclick="closeDrawer();openNew('deal')">+ Create deal</button>`)}
function taskPage(){let active=wrTasks.filter(x=>!x.done).length;let list=wrTasks.filter(x=>JSON.stringify(x).toLowerCase().includes(query)).sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due));return header('My Work','Stay on top of calls, follow-ups, and commitments.','New task').replace("openNew('contact')","newTask()")+toolbarButtons([`<span class="sub">${active} tasks to complete · ${wrTasks.length} total</span>`])+`<section class="panel">${list.map(t=>`<div class="checkrow ${t.done?'done':''}"><input type="checkbox" aria-label="Complete ${safe(t.title)}" ${t.done?'checked':''} onchange="toggleTask(${t.id},this.checked)"><div style="flex:1"><b>${safe(t.title)}</b><div class="meta">${safe(t.related)} · Due ${safe(t.due||'unscheduled')}</div></div><button class="record-btn" onclick="editTask(${t.id})">Edit</button></div>`).join('')||'<div class="empty-note">No tasks match your search.</div>'}</section>`}
function newTask(related=''){openDrawer(`<div class="eyebrow">PRODUCTIVITY</div><h2>Create task</h2><form class="formgrid" onsubmit="addTask(event)"><div class="field"><label>Task name</label><input name="title" required maxlength="180"></div><div class="field"><label>Related account</label><input name="related" value="${safe(related)}"></div><div class="field"><label>Due date</label><input type="date" name="due"></div><button class="btn primary">Create task</button></form>`)}
function addTask(e){e.preventDefault();wrTasks.unshift({id:nextId(),...Object.fromEntries(new FormData(e.target)),done:false});saveV2();closeDrawer();go('tasks');toast('Task created')}
function toggleTask(id,done){let t=wrTasks.find(x=>x.id===id);if(t){t.done=done;saveV2();render();toast(done?'Task completed':'Task reopened')}}
function editTask(id){let t=wrTasks.find(x=>x.id===id);if(!t)return;openDrawer(`<div class="eyebrow">TASK</div><h2>Edit task</h2><form class="formgrid" onsubmit="updateTask(event,${id})"><div class="field"><label>Task</label><input name="title" required value="${safe(t.title)}"></div><div class="field"><label>Related</label><input name="related" value="${safe(t.related)}"></div><div class="field"><label>Due date</label><input type="date" name="due" value="${safe(t.due)}"></div><button class="btn primary">Save changes</button></form>`)}
function updateTask(e,id){e.preventDefault();Object.assign(wrTasks.find(x=>x.id===id),Object.fromEntries(new FormData(e.target)));saveV2();closeDrawer();render();toast('Task saved')}
function activityPage(){let list=wrNotes.filter(x=>JSON.stringify(x).toLowerCase().includes(query));return header('Activities','Log calls, meetings, emails, and notes.','Log activity').replace("openNew('contact')","newActivity()")+`<section class="panel"><div class="panelhead"><h3>Activity timeline</h3><button class="action-quiet" onclick="newActivity()">+ Log activity</button></div>${list.map(x=>`<div class="activity"><span class="dot">◷</span><div><b>${safe(x.type)} · ${safe(x.subject)}</b><small>${safe(x.related)} · ${safe(x.created)}</small><p>${safe(x.body)}</p></div></div>`).join('')||'<div class="empty-note">No activity logged yet. Add a note or call to begin the timeline.</div>'}</section>`}
function newActivity(related=''){openDrawer(`<div class="eyebrow">TIMELINE</div><h2>Log activity</h2><form class="formgrid" onsubmit="addActivity(event)"><div class="field"><label>Type</label><select name="type"><option>Call</option><option>Meeting</option><option>Email</option><option>Note</option></select></div><div class="field"><label>Subject</label><input name="subject" required></div><div class="field"><label>Related account</label><input name="related" value="${safe(related)}"></div><div class="field"><label>Details</label><textarea name="body" rows="4" style="width:100%;border:1px solid #dde3ed;border-radius:9px;padding:10px"></textarea></div><button class="btn primary">Save activity</button></form>`)}
function addActivity(e){e.preventDefault();wrNotes.unshift({id:nextId(),...Object.fromEntries(new FormData(e.target)),created:new Date().toLocaleString()});saveV2();closeDrawer();go('activities');toast('Activity logged')}
function settingsPage(){return header('Settings','Your current workspace and data access.')+`<div class="settingsgrid"><section class="panel"><h3>Workspace</h3><p class="sub">${safe(window.wrAuthenticatedProfile?.workspace||'Workspace')}</p><p class="sub">Role: ${safe(window.wrAuthenticatedProfile?.role||'Member')}</p><p>Workspace and team administration are managed securely by an administrator.</p></section><section class="panel"><h3>Data exports</h3><p class="sub">Exports contain records loaded from your current authorized workspace.</p><div class="actions"><button class="action-quiet" onclick="exportCSV('contacts')">Export contacts</button><button class="action-quiet" onclick="exportCSV('deals')">Export deals</button><button class="action-quiet" onclick="exportCSV('tasks')">Export tasks</button></div></section></div>`}
function saveSettings(){toast('Workspace settings are managed by administrators')}
function resetAll(){toast('Sample data resets are disabled')}
function exportCSV(what){let rows=({contacts,deals,leads:wrLeads,tasks:wrTasks,companies:wrCompanies})[what]||[];if(!rows.length){toast('No data to export');return}let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))],out=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');let url=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='workrelief-'+what+'.csv';a.click();URL.revokeObjectURL(url);toast('Export created')}
const originalOpenNew=openNew;
openNew=function(kind){if(kind==='lead'||(!kind&&page==='leads'))return newLead();if(kind==='task'||(!kind&&page==='tasks'))return newTask();if(kind==='company'||(!kind&&page==='companies'))return newCompany();if(kind==='activity'||(!kind&&page==='activities'))return newActivity();return originalOpenNew(kind)};
const originalDetail=detail;
detail=function(id){let c=contacts.find(c=>c.id===id);if(!c)return;originalDetail(id);let box=document.getElementById('drawer');let actions=document.createElement('div');actions.className='actions';actions.innerHTML=`<button class="action-quiet" onclick="newActivity('${safe(c.company)}')">+ Log activity</button><button class="action-quiet" onclick="newTask('${safe(c.company)}')">+ Follow-up</button><button class="action-quiet" onclick="editContact(${id})">Edit contact</button>`;box.appendChild(actions)};
function editContact(id){let c=contacts.find(x=>x.id===id);if(!c)return;openDrawer(`<div class="eyebrow">CONTACT</div><h2>Edit contact</h2><form class="formgrid" onsubmit="updateContact(event,${id})"><div class="field"><label>Name</label><input name="name" required value="${safe(c.name)}"></div><div class="field"><label>Company</label><input name="company" required value="${safe(c.company)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${safe(c.email)}"></div><div class="field"><label>Phone</label><input name="phone" value="${safe(c.phone)}"></div><div class="field"><label>Status</label><select name="status">${['Lead','Prospect','Customer'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary">Save contact</button></form>`)}
function updateContact(e,id){e.preventDefault();Object.assign(contacts.find(c=>c.id===id),Object.fromEntries(new FormData(e.target)));saveV2();closeDrawer();go('contacts');toast('Contact updated')}
let menuPages=['dashboard','leads','contacts','companies','pipeline','tasks','activities','reports','settings','apps'];
cyclePage=function(){let i=menuPages.indexOf(page);go(menuPages[(i+1)%menuPages.length])};
render();
</script><div class="toast" id="wr-toast" role="status" aria-live="polite"></div>

const navNames={dashboard:['⌂','Dashboard'],leads:['♧','Leads'],contacts:['♙','Contacts'],companies:['▥','Companies'],pipeline:['◉','Deals'],activities:['▣','Activities'],tasks:['☑','Tasks'],reports:['▥','Reports'],settings:['⚙','Settings'],apps:['✧','Connected apps']};

const top=document.querySelector('.top');const crumb=top.querySelector('.crumb');if(crumb)crumb.style.display='none';
const right=top.querySelector('.right');if(right){right.insertAdjacentHTML('afterbegin','<button class="topbell" aria-label="Notifications" title="Notifications are not connected yet" onclick="toast(\'Notifications will be available when integrations are connected\')">♧</button>');const avatar=right.querySelector('.avatar');}
const search=top.querySelector('#search');if(search)search.placeholder='⌕   Search contacts, companies, deals, or anything...';
const topBtn=right?.querySelector('.btn.primary');if(topBtn){topBtn.textContent='＋ New Deal';topBtn.onclick=()=>openNew('deal')}
function excerpt(s,n=20){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
const originalDashboard=dashboard;
dashboard=function(){
 const active=deals.filter(d=>d.stage!=='Won');const total=active.reduce((a,d)=>a+Number(d.value||0),0);const won=deals.filter(d=>d.stage==='Won').reduce((a,d)=>a+Number(d.value||0),0);
 const groups=[{label:'New Lead',stage:['New','Contacted']},{label:'Qualified',stage:['Qualified']},{label:'Proposal',stage:['Proposal']},{label:'Negotiation',stage:['Negotiation']},{label:'Won',stage:['Won']}];
 const count=wrTasks.filter(t=>!t.done).length;const now=new Date();
 const datestr=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
 const person=d=>d.owner||contacts.find(c=>c.company===d.company)?.name||'Unassigned';
 const card=(d)=>`<div class="wr-deal" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${d.id}')" onclick="dealDetail(${d.id})" title="Open ${safe(d.title)}"><div class="wr-deal-top"><span class="wr-glyph">◇</span><span style="min-width:0"><span class="wr-deal-name">${safe(excerpt(d.company,24))}</span><span class="wr-deal-money">${money(d.value)}</span></span></div><div class="wr-deal-person"><span class="wr-avatar">${safe(person(d).slice(0,1))}</span>${safe(excerpt(person(d),19))}</div></div>`;
 const lanes=groups.map(g=>{const ds=deals.filter(d=>g.stage.includes(d.stage));const sum=ds.reduce((a,d)=>a+Number(d.value||0),0);return `<div class="wr-lane" data-stage="${g.stage[0]}" ondragover="event.preventDefault();this.classList.add('isover')" ondragleave="this.classList.remove('isover')" ondrop="dropDeal(event,this);this.classList.remove('isover')"><div class="wr-lanename">${g.label}</div><div class="wr-lanestats">${ds.length} deals · ${money(sum)}</div>${ds.slice(0,4).map(card).join('')}${ds.length>4?`<button class="smalllink" onclick="go('pipeline')">+${ds.length-4} more</button>`:''}</div>`}).join('');
 const activities=wrTasks.filter(t=>!t.done).slice(0,4);
 const upcoming=activities.map((t,i)=>`<div class="wr-event"><time>${safe(t.due||'Upcoming')}</time><div class="wr-event-icon">${['☎','▣','✉','▤'][i%4]}</div><div><strong>${safe(excerpt(t.title,29))}</strong><small>${safe(excerpt(t.related||'CRM task',34))}</small></div></div>`).join('') || `<div class="sub">No upcoming tasks. <button class="smalllink" onclick="newTask()">Add a task</button></div>`;
 const updates=wrNotes.slice(0,4).map((n,i)=>`<div class="wr-update"><span class="wr-glyph">${['✧','✉','◇','▣'][i%4]}</span><div><strong>${safe(excerpt(n.related||n.subject,25))}</strong><small>${safe(excerpt(n.type+' · '+n.subject,34))}</small></div></div>`).join('') || `<p class="sub">Customer updates appear when you log activities.</p>`;
 const values=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return deals.filter(x=>{if(!x.created_at)return false;const c=new Date(x.created_at);return c.getFullYear()===d.getFullYear()&&c.getMonth()===d.getMonth()}).reduce((sum,x)=>sum+Number(x.value||0),0)});const peak=Math.max(...values,1);const months=Array.from({length:6},(_,i)=>{let d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return d.toLocaleDateString('en-US',{month:'short'})});

       const companyEmailsMarkup=(c)=>{const extras=rawCompanyEmails.filter(e=>e.company_id===c.id);return `<section class="wr-detail-section" id="wr-company-emails"><h3>Company admin emails</h3><p class="sub">There is one primary admin email. Add others below; make an additional email primary only when you deliberately select it.</p><div class="wr-email-list"><div class="wr-email-row"><span class="address">${safe(c.email||'No primary email yet')}</span><span class="primary-mark">PRIMARY</span></div>${extras.map(x=>`<div class="wr-email-row"><span class="address">${safe(x.email)}</span><button type="button" class="btn" onclick="wrPromoteCompanyEmail('${c.id}','${x.id}')">Make primary</button><button type="button" class="btn" onclick="wrRemoveCompanyEmail('${c.id}','${x.id}')">Remove</button></div>`).join('')}</div><form class="wr-email-controls" onsubmit="wrAddCompanyEmail(event,'${c.id}')"><div class="field"><label>Additional admin email</label><input type="email" name="email" placeholder="admin@company.com" maxlength="254" required></div><button type="submit" class="btn primary">+ Add email</button></form></section>`};
       window.wrAddCompanyEmail=async(e,id)=>{e.preventDefault();const email=String(new FormData(e.target).get('email')||'').trim().toLowerCase();const c=rawCompanies.find(c=>c.id===id);if(!c)return;const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{if(email===String(c.email||'').toLowerCase()||rawCompanyEmails.some(x=>x.company_id===id&&x.email.toLowerCase()===email))throw Error('Email already belongs to this company');const {error}=await sb.from('crm_company_emails').insert({workspace_id:workspaceId,company_id:id,email,created_by:user.id,label:'Additional'});if(error)throw error;await reload();companyDetail(id);toast('Additional email saved')}catch(err){fail(err)}finally{btn.disabled=false}};
       window.wrRemoveCompanyEmail=async(id,emailId)=>{if(!confirm('Remove this additional email from the company?'))return;try{const {data,error}=await sb.from('crm_company_emails').delete().eq('id',emailId).eq('company_id',id).eq('workspace_id',workspaceId).select('id');if(error)throw error;if(!data?.length)throw Error('Email could not be removed');await reload();companyDetail(id);toast('Email removed')}catch(err){fail(err)}};
       window.wrPromoteCompanyEmail=async(id,emailId)=>{const mail=rawCompanyEmails.find(x=>x.company_id===id&&x.id===emailId);if(!mail)return;if(!confirm('Make '+mail.email+' the primary company admin email? The current primary will become an additional email.'))return;try{const {error}=await sb.rpc('wr_set_company_primary_email',{p_company_id:id,p_new_primary:mail.email});if(error)throw error;await reload();companyDetail(id);toast('Primary email updated')}catch(err){fail(err)}};
       const duplicateLabels={industry:'Industry',industry_naics_code:'NAICS code',account_type:'Relationship',status:'Account status',description:'Description',email:'Admin email',phone:'Phone',website:'Website',address_line1:'Street',address_line2:'Suite',city:'City',state_region:'State',postal_code:'Postal code',country:'Country',employee_count:'Employees',annual_revenue:'Annual revenue',source:'Lead source',notes:'Notes'};
       window.wrCloseDuplicate=()=>document.getElementById('wr-duplicate-overlay')?.remove();
       const wrDuplicatePanel=(existing,incoming,originForm)=>{
         wrCloseDuplicate();const el=document.createElement('div');el.id='wr-duplicate-overlay';el.className='wr-duplicate-overlay';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Review existing company before merge');
         const pairs=Object.entries(duplicateLabels).filter(([key])=>String(incoming[key]??'').trim()&&String(incoming[key]??'').trim()!==String(existing[key]??'').trim());
         el.innerHTML=`<div class="wr-duplicate-panel"><div class="wr-duplicate-head"><span class="eyebrow">DUPLICATE COMPANY FOUND</span><button type="button" class="btn" onclick="wrCloseDuplicate()">✕ Close</button></div><h2>${safe(existing.name)} already exists</h2><p class="sub">Review the saved company alongside your new information. No data will change unless you confirm a merge.</p><p class="note"><strong>Primary email:</strong> ${safe(existing.email||'Not set')}<br><small>The current primary is protected. A different submitted email will be added as an additional email.</small></p><div class="wr-duplicate-compare"><div class="item head"><div>Field</div><div>Existing company</div><div>Entered information</div></div>${pairs.map(([key,label])=>`<div class="item"><strong>${safe(label)}</strong><span>${safe(String(existing[key]??'—').slice(0,180))}</span><span>${safe(String(incoming[key]).slice(0,180))}</span></div>`).join('')||'<div class="item">No differing fields found.</div>'}</div><div class="field"><label for="wr-merge-policy">How should we merge?</label><select id="wr-merge-policy"><option value="fill">Fill missing fields only (recommended)</option><option value="replace">Use entered values for differing fields</option></select></div><p class="sub">The company stays a single record. Contacts, deals and history remain linked. The original company name and primary email are preserved.</p><div class="wr-duplicate-actions"><button type="button" class="btn" id="wr-open-existing">Open existing company</button><button type="button" class="btn" onclick="wrCloseDuplicate()">Keep editing</button><button type="button" class="btn primary" id="wr-confirm-merge">Confirm merge</button></div></div>`;
         document.body.appendChild(el);
         el.querySelector('#wr-open-existing').onclick=()=>{wrCloseDuplicate();companyDetail(existing.id)};
         el.querySelector('#wr-confirm-merge').onclick=async()=>{const btn=el.querySelector('#wr-confirm-merge');btn.disabled=true;btn.textContent='Merging…';try{const {error}=await sb.rpc('wr_merge_existing_company',{p_company_id:existing.id,p_incoming:incoming,p_replace_nonempty:el.querySelector('#wr-merge-policy').value==='replace'});if(error)throw error;wrCloseDuplicate();await reload();closeDrawer();go('companies');toast('Company information merged successfully')}catch(err){fail(err);btn.disabled=false;btn.textContent='Confirm merge'}};
         el.querySelector('.wr-duplicate-panel').focus();
       };
      newCompany=()=>openDrawer(`<div class="eyebrow">COMPANIES</div><h2>Add company</h2><p class="sub">Create the company and its primary account contact together. Additional contacts can be added after saving.</p><form class="formgrid wr-company-form" onsubmit="addCompany(event)"><section class="wr-form-section"><h3>Primary account contact</h3><p class="sub">The first person is added directly to Contacts. Leads are never converted automatically.</p><div class="wr-form-pair"><div class="field"><label>Primary contact full name *</label><input name="primary_contact_name" required maxlength="180" autocomplete="name" placeholder="Full name"></div><div class="field"><label>Primary contact phone</label><input name="primary_contact_phone" type="tel" maxlength="40" placeholder="Phone number"></div></div><p class="sub">Enter the primary email in the Contact information section below. It will also be used for the first contact.</p></section>${companyFields()}<div class="wr-drawer-footer actions"><button type="submit" class="btn primary">Save company and contact</button><button type="button" class="btn" onclick="closeDrawer()">Cancel</button></div></form>`);
      addCompany=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!wrVerifyNaicsIndustry(e.target))return;if(!f.primary_contact_name?.trim()||!f.email?.trim()){toast('Primary contact name and email are required');return;}const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const match=rawCompanies.find(c=>c.name.trim().toLowerCase()===f.name.trim().toLowerCase());if(match){wrDuplicatePanel(match,companyPayload(f),e.target);return}const payload={...companyPayload(f),workspace_id:workspaceId};const {data,error}=await sb.rpc('wr_create_company_with_primary_contact',{p_company:payload,p_primary_name:f.primary_contact_name.trim(),p_primary_email:f.email.trim(),p_primary_phone:f.primary_contact_phone?.trim()||null});if(error)throw error;if(!data)throw Error('Company creation did not return a record');await reload();closeDrawer();go('companies');toast('Company and primary contact created')}catch(err){fail(err)}finally{btn.disabled=false}};
      window.editCompany=id=>{const c=wrCompanies.find(x=>x.id===id);if(!c)return;openDrawer(`<div class="eyebrow">COMPANY ACCOUNT</div><h2>Edit ${safe(c.name)}</h2><p class="sub">Updates are saved to the shared workspace.</p><form class="formgrid wr-company-form" onsubmit="saveCompanyEdit(event,'${c.id}')">${companyFields(c)}<div class="wr-drawer-footer actions"><button type="submit" class="btn primary">Save changes</button><button type="button" class="btn" onclick="companyDetail('${c.id}')">Cancel</button></div></form>`)};
      window.saveCompanyEdit=async(e,id)=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!wrVerifyNaicsIndustry(e.target))return;const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const existing=companyId(f.name);if(existing&&existing!==id)throw Error('Another company already uses that name');const payload=companyPayload(f);delete payload.email;await change('crm_companies',id,payload);closeDrawer();go('companies');toast('Company updated')}catch(err){fail(err)}finally{btn.disabled=false}};
      companyPage=()=>{const list=wrCompanies.filter(c=>JSON.stringify(c).toLowerCase().includes(query));return header('Companies','Manage your business accounts and connected relationships.','New company').replace("openNew('contact')","newCompany()")+`<div class="toolbar"><span class="sub">${list.length} companies</span></div><div class="tablewrap"><table><thead><tr><th>Company</th><th>Industry</th><th>Contacts</th><th>Deals</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${safe(c.name)}</b></td><td>${safe(c.industry||'—')}</td><td>${contacts.filter(x=>x.company_id===c.id&&x.status!=='Lead').length}</td><td>${deals.filter(d=>d.company_id===c.id).length}</td><td><button class="record-btn" onclick="companyDetail('${safe(c.id)}')">Open →</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No companies yet. Add one to get started.</td></tr>'}</tbody></table></div>`};
      const showTimeline=({contactId=null,companyId=null,dealId=null})=>{const related=(window.wrEvents||[]).filter(e=>(contactId&&e.contact_id===contactId)||(companyId&&e.company_id===companyId)||(dealId&&e.deal_id===dealId)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return related.length?related.map(e=>`<div class="activity"><span class="dot">◷</span><div><b>${safe(e.details||e.event_type)}</b><small>${safe(new Date(e.created_at).toLocaleString())}</small></div></div>`).join(''):'<p class="sub">No history recorded yet.</p>'};
      companyDetail=id=>{const c=wrCompanies.find(x=>x.id===id);if(!c)return;const cc=contacts.filter(x=>x.company_id===id&&x.status!=='Lead'),ll=contacts.filter(x=>x.company_id===id&&x.status==='Lead'),dd=deals.filter(x=>x.company_id===id),aa=rawActivities.filter(x=>x.company_id===id||x.contact_id&&rawContacts.some(y=>y.id===x.contact_id&&y.company_id===id));const field=(label,value)=>`<div class="wr-account-fact"><span>${label}</span><strong>${safe(String(value||'—'))}</strong></div>`;const addr=[c.address_line1,c.address_line2,[c.city,c.state_region,c.postal_code].filter(Boolean).join(', '),c.country].filter(Boolean).join(' · ');openDrawer(`<div class="eyebrow">COMPANY ACCOUNT</div><h2>${safe(c.name)}</h2><p class="sub">${safe(c.account_type||'Prospect')} · ${safe(c.status||'Active')}</p><div class="wr-account-metrics"><div><strong>${cc.length}</strong><span>Contacts</span></div><div><strong>${dd.length}</strong><span>Deals</span></div><div><strong>${aa.length}</strong><span>Activities</span></div></div><div class="actions"><button class="btn primary" onclick="editCompany('${id}')">Edit account</button><button class="btn" onclick="newContactForCompany('${id}')">+ Contact</button></div><section class="wr-detail-section"><h3>Account overview</h3><div class="wr-account-grid">${field('Industry',c.industry)}${field('Phone',c.phone)}${field('Email',c.email)}${field('Website',c.website)}${field('Employees',c.employee_count)}${field('Annual revenue',c.annual_revenue==null?'':money(Number(c.annual_revenue)))}${field('Source',c.source)}${field('Address',addr)}</div>${c.description?`<p>${safe(c.description)}</p>`:''}${c.notes?`<div class="note"><b>Internal notes</b><p>${safe(c.notes)}</p></div>`:''}</section><section class="wr-detail-section"><h3>Contacts (${cc.length})</h3>${cc.map(x=>`<div class="activity"><span class="face">${safe(x.name[0])}</span><div><b>${safe(x.name)}${rawContacts.find(rc=>rc.id===x._remoteId)?.is_primary_company_contact?' · Primary contact':''}</b><small>${safe(x.email||'')}</small></div></div>`).join('')||'<p class="sub">No contacts linked yet.</p>'}${ll.length?`<p class="sub">${ll.length} unconverted lead(s) associated with this company.</p>`:''}</section><section class="wr-detail-section"><h3>Opportunities (${dd.length})</h3>${dd.map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(d.value)} · ${safe(d.stage)}</small></div></div>`).join('')||'<p class="sub">No opportunities yet.</p>'}</section><section class="wr-detail-section"><h3>Recent activities</h3>${aa.slice(0,8).map(x=>`<div class="activity"><span class="dot">◷</span><div><b>${safe(x.title)}</b><small>${safe(x.kind)} · ${safe(x.created_at?.slice(0,10)||'')}</small></div></div>`).join('')||'<p class="sub">No activities logged.</p>'}</section>${companyEmailsMarkup(c)}<section class="wr-detail-section"><h3>Account history</h3>${showTimeline({companyId:id})}</section><div class="actions"><button class="btn primary" onclick="newTaskForCompany('${id}')">+ Follow-up</button><button class="btn" onclick="newActivityForCompany('${id}')">+ Log activity</button></div>`)};
      window.newContactForCompany=id=>{openNew('contact');const form=document.querySelector('#drawer form');const sel=form?.querySelector('[name=company_id]');if(sel)sel.value=id};

      contactTimeline=c=>showTimeline({contactId:c._remoteId});
      detail=id=>{const c=contacts.find(x=>x.id===id);if(!c||c.status==='Lead')return;const dd=deals.filter(d=>d.contact_id===c._remoteId);openDrawer(`<div class="eyebrow">CONTACT PROFILE</div><div class="clienthead"><span class="face">${safe(c.name[0])}</span><div><h2>${safe(c.name)}</h2><p class="sub">${safe(c.company)}</p></div></div><div class="note"><b>Contact details</b><p>${safe(c.email||'No email')}<br>${safe(c.phone||'No phone')}</p></div><h3>Deals</h3>${dd.map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(d.value)} · ${safe(d.stage)}</small></div></div>`).join('')||'<p class="sub">No linked deals.</p>'}<h3>Customer timeline</h3>${contactTimeline(c)}<div class="actions"><button class="btn primary" onclick="newTaskForContact(${c.id})">+ Follow-up</button><button class="action-quiet" onclick="newActivityForContact(${c.id})">+ Log activity</button></div>`)};
      window.newTaskForContact=id=>{const c=contacts.find(x=>x.id===id);if(!c)return;newTask();const f=document.querySelector('#drawer form');f.insertAdjacentHTML('beforeend',`<input type="hidden" name="contact_id" value="${safe(c._remoteId)}">`)};
      window.newActivityForContact=id=>{const c=contacts.find(x=>x.id===id);if(!c)return;newActivity();const f=document.querySelector('#drawer form');f.insertAdjacentHTML('beforeend',`<input type="hidden" name="contact_id" value="${safe(c._remoteId)}">`)};
      newLead=()=>openDrawer(`<div class="eyebrow">LEADS</div><h2>New lead</h2><form class="formgrid" onsubmit="addLead(event)"><div class="field"><label>Name</label><input name="name" required maxlength="180"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Company</label><select name="company_id">${companyOptions()}</select></div><button class="btn primary">Save lead</button></form>`);

      const viewRecord=(eyebrow,title,body,handler,label)=>openDrawer(`<div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="sub">Changes are saved to your WorkRelief workspace.</p><form class="wr-management-form" onsubmit="${handler}">${body}${formActions(label)}</form>`);
      const leadForm=(c={})=>section('Lead details',field('Full name *','name',c.name,'text','required maxlength="180"')+field('Email','email',c.email,'email')+field('Telephone','phone',c.phone,'tel')+selCompanies(c.company_id)+choice('Lead progress','lead_status',[['new','New'],['contacted','Contacted'],['qualified','Qualified'],['disqualified','Disqualified']],c.lead_status||'new')+field('Source','source',c.source))+section('Qualification and internal notes',area('Notes','notes',c.notes));
      const contactForm=(c={})=>section('Contact information',field('Full name *','name',c.name,'text','required maxlength="180"')+field('Email','email',c.email,'email')+field('Phone','phone',c.phone,'tel')+selCompanies(c.company_id)+choice('Relationship','status',[['prospect','Prospect'],['customer','Customer'],['inactive','Inactive']],(c.status||'prospect').toLowerCase())+field('Job title','job_title',c.job_title))+section('Relationship notes',area('Notes','notes',c.notes));
      const dealForm=(d={})=>section('Opportunity',field('Deal name *','title',d.title,'text','required maxlength="180"')+field('Amount (USD)','amount',d.amount||0,'number','min="0" step="0.01"')+choice('Pipeline stage','stage',[['new','New'],['qualified','Qualified'],['proposal','Proposal'],['negotiation','Negotiation'],['won','Won'],['lost','Lost']],d.stage||'new')+field('Expected close','expected_close',d.expected_close,'date')+selCompanies(d.company_id)+selContacts(d.contact_id))+section('Sales notes',area('Opportunity notes','notes',d.notes));
      const activityForm=(a={})=>section('Activity / follow-up',field('Subject *','title',a.title,'text','required maxlength="180"')+choice('Type','kind',[['task','Task'],['call','Call'],['meeting','Meeting'],['note','Note']],a.kind||'task')+field('Due date and time','due_at',a.due_at?.slice(0,16)||'','datetime-local')+selCompanies(a.company_id)+selContacts(a.contact_id)+choice('Status','completed',[['false','Open'],['true','Completed']],String(!!a.completed)))+section('Details',area('Notes and outcome','notes',a.notes));
      const safePayload=(f,allowed)=>Object.fromEntries(allowed.filter(k=>Object.hasOwn(f,k)).map(k=>[k,f[k]===''?null:f[k]]));
      const saveForm=async(e,table,id,payload,landing)=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Saving…';try{if(id)await change(table,id,payload);else await create(table,payload);closeDrawer();go(landing);toast('Changes saved')}catch(err){fail(err);btn.disabled=false;btn.textContent='Save changes'}};
      window.wrEditRecord=(kind,id)=>{const table={lead:'crm_contacts',contact:'crm_contacts',deal:'crm_deals',activity:'crm_activities'}[kind];const raw={lead:rawContacts,contact:rawContacts,deal:rawDeals,activity:rawActivities}[kind]?.find(x=>x.id===id);if(!raw)return;const form={lead:leadForm,contact:contactForm,deal:dealForm,activity:activityForm}[kind](raw);viewRecord(kind.toUpperCase(),`Edit ${kind}`,form,`wrSaveRecord(event,'${kind}','${id}')`,'Save changes')};
      window.wrSaveRecord=(e,kind,id)=>{const f=Object.fromEntries(new FormData(e.target));let table,landing,payload;switch(kind){
      case 'lead':table='crm_contacts';landing='leads';payload={...safePayload(f,['name','email','phone','company_id','lead_status','source','notes']),status:'lead'};break;
      case 'contact':table='crm_contacts';landing='contacts';payload=safePayload(f,['name','email','phone','company_id','status','job_title','notes']);break;
      case 'deal':table='crm_deals';landing='pipeline';payload=safePayload(f,['title','amount','stage','expected_close','company_id','contact_id','notes']);break;
      default:table='crm_activities';landing='activities';payload=safePayload(f,['title','kind','due_at','company_id','contact_id','completed','notes']);payload.completed=f.completed==='true';if(payload.due_at)payload.due_at=new Date(payload.due_at).toISOString();}
      if(payload.name)payload.name=payload.name.trim();if(payload.title)payload.title=payload.title.trim();if(payload.company_id){const company=rawCompanies.find(c=>c.id===payload.company_id);if(table==='crm_contacts')payload.company=company?.name||'';}
      if(payload.contact_id){const person=rawContacts.find(c=>c.id===payload.contact_id);if(person?.company_id&&payload.company_id&&person.company_id!==payload.company_id){toast('The contact belongs to a different company');return}}
      saveForm(e,table,id,payload,landing)};
      newLead=()=>viewRecord('LEADS','Add lead',leadForm(),"wrSaveRecord(event,'lead','')",'Save lead');
      openNew=kind=>{kind=kind||(page==='pipeline'?'deal':page==='leads'?'lead':'contact');if(kind==='lead')return newLead();if(kind==='deal')return viewRecord('DEALS','Create opportunity',dealForm(),"wrSaveRecord(event,'deal','')",'Save deal');return viewRecord('CONTACTS','Add contact',contactForm(),"wrSaveRecord(event,'contact','')",'Save contact')};
      newTask=()=>viewRecord('TASKS','Create follow-up',activityForm({kind:'task'}),"wrSaveRecord(event,'activity','')",'Save task');
      newActivity=()=>viewRecord('ACTIVITIES','Log activity',activityForm({kind:'note'}),"wrSaveRecord(event,'activity','')",'Save activity');
      window.wrEditLead=id=>{const c=contacts.find(x=>x.id===id);if(c)window.wrEditRecord('lead',c._remoteId)};
      window.wrEditContact=id=>{const c=contacts.find(x=>x.id===id);if(c)window.wrEditRecord('contact',c._remoteId)};
      window.wrEditDeal=id=>{const d=deals.find(x=>x.id===id);if(d)window.wrEditRecord('deal',d._remoteId)};
      editTask=id=>{const t=wrTasks.find(x=>x.id===id);if(t)window.wrEditRecord('activity',t._remoteId)};
      window.wrEditActivity=id=>window.wrEditRecord('activity',id);
      // All management panels close after a successful database write, never before it.
      // Editing actions are explicit; status may also be changed directly where appropriate.
      // A lead opens its complete record manager rather than the obsolete sparse profile.
      leadDetail=id=>{
        const c=contacts.find(x=>x.id===id&&x.status==='Lead');if(!c)return;
        window.wrEditRecord('lead',c._remoteId);
        const form=document.querySelector('#drawer .wr-management-form');if(!form)return;
        form.insertAdjacentHTML('afterbegin',`<section class="wr-lead-quick-actions" aria-label="Lead actions"><div><strong>${safe(c.name)}</strong><span>${safe(c.company||'No company')} · ${safe(c.email||'No email')}</span></div><div class="wr-lead-quick-buttons"><button type="button" class="btn primary" onclick="convertLead(${id})">Convert to contact</button><button type="button" class="btn" onclick="wrLeadFollowUp(${id})">+ Follow-up</button></div></section>`);
      };
      window.wrLeadFollowUp=id=>{
        const c=contacts.find(x=>x.id===id&&x.status==='Lead');if(!c)return;
        newTask();const f=document.querySelector('#drawer form');
        if(f){f.insertAdjacentHTML('beforeend',`<input type="hidden" name="contact_id" value="${safe(c._remoteId)}">`);const co=f.querySelector('select[name="company_id"]');if(co&&c.company_id)co.value=c.company_id;}
      };
      const originalContactDetail=detail;
      detail=id=>{originalContactDetail(id);const box=document.getElementById('drawer');box.insertAdjacentHTML('beforeend',`<div class="wr-management-shell"><button class="btn primary" onclick="wrEditContact(${id})">Edit contact details</button></div>`)};
      const originalDealDetail=dealDetail;
      dealDetail=id=>{originalDealDetail(id);const box=document.getElementById('drawer');box.insertAdjacentHTML('beforeend',`<div class="wr-management-shell"><button class="btn primary" onclick="wrEditDeal(${id})">Edit deal details</button></div>`)};
      // Account editors already have comprehensive sections; ensure Save closes on successful update.
      await reload();

      document.body.classList.remove('wr-auth-pending');document.body.classList.add('wr-auth-ready');
      sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.replace('login.html')});
    }
  }
}catch(err){deny('Unable to verify access: '+(err?.message||'unknown error'));}
</script>

<script>
function toggleCRMNav(force){
 const side=document.querySelector('.sidebar'),back=document.getElementById('wr-mobile-backdrop'),button=document.getElementById('wr-mobile-menu');
 const open=typeof force==='boolean'?force:!side.classList.contains('wr-open');
 side.classList.toggle('wr-open',open);back.hidden=!open;
 if(button)button.setAttribute('aria-expanded',String(open));
}
document.getElementById('wr-mobile-backdrop')?.addEventListener('click',()=>toggleCRMNav(false));
document.querySelectorAll('.sidebar .nav [data-page]').forEach(b=>b.addEventListener('click',()=>toggleCRMNav(false)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleCRMNav(false)});
</script>

<script>
(()=>{
 const trigger=document.getElementById('wr-user-trigger'),menu=document.getElementById('wr-user-menu');
 const close=()=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false')};
 trigger.addEventListener('click',()=>{const opening=menu.hidden;menu.hidden=!opening;trigger.setAttribute('aria-expanded',String(opening))});
 document.addEventListener('click',e=>{if(!document.getElementById('wr-user-menu-wrap').contains(e.target))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 document.getElementById('wr-settings-action').addEventListener('click',()=>{close();go('settings')});
 document.getElementById('wr-profile-action').addEventListener('click',()=>{
  close();const p=window.wrAuthenticatedProfile||{};
  const container=document.createElement('div');container.className='wr-profile-details';
  const heading=document.createElement('h2');heading.textContent='My profile';container.append(heading);
  const description=document.createElement('p');description.textContent='Your authenticated WorkRelief account information.';container.append(description);
  for(const [label,value] of [['Name',p.name],['Email',p.email],['Workspace',p.workspace],['Role',p.role]]){
   const field=document.createElement('div');field.className='note';const title=document.createElement('strong');title.textContent=label;const detail=document.createElement('div');detail.textContent=value||'Not provided';field.append(title,detail);container.append(field);
  }
  openDrawer(container.outerHTML);
 });
})();

function wrStateOptions(current){
  const states = [["AL", "Alabama"], ["AK", "Alaska"], ["AZ", "Arizona"], ["AR", "Arkansas"], ["CA", "California"], ["CO", "Colorado"], ["CT", "Connecticut"], ["DE", "Delaware"], ["FL", "Florida"], ["GA", "Georgia"], ["HI", "Hawaii"], ["ID", "Idaho"], ["IL", "Illinois"], ["IN", "Indiana"], ["IA", "Iowa"], ["KS", "Kansas"], ["KY", "Kentucky"], ["LA", "Louisiana"], ["ME", "Maine"], ["MD", "Maryland"], ["MA", "Massachusetts"], ["MI", "Michigan"], ["MN", "Minnesota"], ["MS", "Mississippi"], ["MO", "Missouri"], ["MT", "Montana"], ["NE", "Nebraska"], ["NV", "Nevada"], ["NH", "New Hampshire"], ["NJ", "New Jersey"], ["NM", "New Mexico"], ["NY", "New York"], ["NC", "North Carolina"], ["ND", "North Dakota"], ["OH", "Ohio"], ["OK", "Oklahoma"], ["OR", "Oregon"], ["PA", "Pennsylvania"], ["RI", "Rhode Island"], ["SC", "South Carolina"], ["SD", "South Dakota"], ["TN", "Tennessee"], ["TX", "Texas"], ["UT", "Utah"], ["VT", "Vermont"], ["VA", "Virginia"], ["WA", "Washington"], ["WV", "West Virginia"], ["WI", "Wisconsin"], ["WY", "Wyoming"], ["DC", "District of Columbia"], ["PR", "Puerto Rico"], ["GU", "Guam"], ["VI", "U.S. Virgin Islands"], ["AS", "American Samoa"], ["MP", "Northern Mariana Islands"]];
  const value=String(current||'').trim();
  const match=states.find(([code,label])=>code.toLowerCase()===value.toLowerCase()||label.toLowerCase()===value.toLowerCase());
  const selected=match?match[0]:value;
  const known=states.some(([code])=>code===selected);
  return `<option value="">Select state / territory</option>`+
    (!known&&selected?`<option value="${safe(selected)}" selected>${safe(selected)} (previously saved)</option>`:'')+
    states.map(([code,label])=>`<option value="${code}" ${selected===code?'selected':''}>${safe(label)} (${code})</option>`).join('');
}

</script>
