body.wr-auth-pending .app{visibility:hidden}body.wr-auth-ready .app{visibility:visible}body.wr-auth-ready #wr-auth-screen{display:none!important}
/* CRM sidebar visibility and account controls — preserve existing navigation. */
.sidebar{height:100dvh;max-height:100dvh;overflow:hidden;min-height:0}
.sidebar .nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#cbd8ea transparent;padding-right:3px}
.sidebar .bottom{flex:0 0 auto;margin-top:0;max-height:150px;overflow:auto}
.sidebar .wr-account{flex:0 0 auto;padding:14px 0 5px;border-top:1px solid #e8edf5;background:#fff}
.wr-account-email{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#667995;padding:0 8px 8px}
.wr-signout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;border:1px solid #1254e4;background:#1461fa;color:#fff;border-radius:11px;font-weight:750;text-align:center;padding:11px 14px;cursor:pointer;box-shadow:0 4px 12px #1461fa25}
.wr-signout:hover,.wr-signout:focus-visible{background:#084bd2;outline:2px solid #b2caff;outline-offset:2px}
.wr-signout:disabled{opacity:.65;cursor:wait}
@media(max-width:950px){.sidebar .wr-account{padding:8px 0}.wr-account-email{display:none}.wr-signout{font-size:0;padding:10px 2px}.wr-signout::before{content:'⇥';font-size:22px}.sidebar .bottom{display:none}}
@media(max-width:700px){.sidebar{display:none}.wr-mobile-signout{display:inline-flex!important}}
.wr-mobile-signout{display:none;border:1px solid #1254e4;border-radius:9px;background:#1461fa;color:white;padding:8px 10px;font-weight:700}

.wr-mobile-backdrop{display:none}
@media(max-width:700px){
 .sidebar.wr-open{display:flex!important;position:fixed;left:0;top:0;height:100dvh;max-height:100dvh;width:min(290px,84vw);min-width:0;z-index:1001;box-shadow:10px 0 40px #102b4b33}
 .sidebar.wr-open .nav button{font-size:13px;justify-content:flex-start;padding:11px 14px}
 .sidebar.wr-open .nav button i{font-size:20px}
 .sidebar.wr-open .wr-account{display:block}
 .sidebar.wr-open .wr-signout{font-size:13px;text-align:left;padding:10px 12px}
 .sidebar.wr-open .wr-signout::before{content:none}
 .wr-mobile-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:1000;background:#0d234477}
 .top .mobile{display:inline-flex!important;align-items:center;justify-content:center}
}

/* Account menu and unobtrusive scrolling */

/* WorkRelief drawer actions: equal columns, no forced full-width primary action. */
.drawerback .drawer .actions {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  align-items:stretch;
}
.drawerback .drawer .actions > .primary:first-child {
  grid-column:auto;
}
.drawerback .drawer .actions > button {
  width:100%; min-width:0; min-height:44px;
  margin:0; display:flex; justify-content:center; align-items:center;
  text-align:center;
}
/* A single action can use the whole row, while multi-action drawers remain paired. */
.drawerback .drawer .actions > button:only-child {grid-column:1 / -1;}
@media (max-width:380px) {
  .drawerback .drawer .actions {grid-template-columns:minmax(0,1fr);}
  .drawerback .drawer .actions > button:only-child {grid-column:auto;}
}

  const oldSections=[...form.querySelectorAll(':scope > .wr-form-section')];

function wrSimpleModal({category='WORKRELIEF',title,description='',body,actions=[],onDismiss=()=>{}}){

 const dialog=document.createElement('section');dialog.className='wm-dialog wm-compact';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');

 const h=document.createElement('h2');h.className='wm-heading';h.textContent=title;const p=document.createElement('p');p.className='wm-description';p.textContent=description;
 const close=document.createElement('button');close.className='wm-close';close.type='button';close.textContent='×';close.setAttribute('aria-label','Close');
 const scroll=document.createElement('div');scroll.className='wm-scroll';const section=document.createElement('section');section.className='wm-section';section.append(body);scroll.append(section);
 const footer=document.createElement('footer');footer.className='wm-footer';for(const {label,primary,onClick} of actions){const btn=document.createElement('button');btn.type='button';btn.className='btn'+(primary?' primary':'');btn.textContent=label;btn.onclick=()=>onClick(finish);footer.append(btn)}
 const oldFocus=document.activeElement;function finish(){overlay.remove();document.removeEventListener('keydown',key);oldFocus?.focus?.()}
 function dismiss(){finish();onDismiss()}function key(e){if(e.key==='Escape')dismiss()}close.onclick=dismiss;overlay.onclick=e=>{if(e.target===overlay)dismiss()};document.addEventListener('keydown',key);
 header.append(eyebrow,h,p,close);dialog.append(header,scroll,footer);overlay.append(dialog);document.body.append(overlay);close.focus();return {overlay,dialog,finish};
}

<script>
const seedContacts=[];
const seedDeals=[];
const stages=['New','Contacted','Qualified','Proposal','Negotiation','Won'];let contacts=load('wr_contacts',seedContacts),deals=load('wr_deals',seedDeals),page='dashboard',query='';function load(k,v){return []}function save(){/* Database persistence is handled by authenticated Supabase actions. */}function money(v){return '$'+Number(v).toLocaleString('en-US')}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function title(s){return ({dashboard:'Overview',leads:'Leads',contacts:'Contacts',companies:'Companies',pipeline:'Deals & Pipeline',activities:'Activities',reports:'Reports',apps:'Connected apps'})[s]}
function header(t,d,button='New contact'){return `<div class="heading"><div><div class="eyebrow">WORKRELIEF CRM</div><h1>${t}</h1><p class="desc">${d}</p></div><button class="btn primary" onclick="openNew('${button==='New deal'?'deal':'contact'}')">＋ ${button}</button></div>`}function stat(label,num,note){return `<div class="stat"><div class="label">${label}</div><div class="num">${num}</div><div class="trend">${note}</div></div>`}
function dashboard(){let open=deals.filter(d=>d.stage!=='Won'),total=open.reduce((s,d)=>s+d.value,0);return header('Good morning 👋','Here is what is happening across your customer relationships.')+`<div class="stats">${stat('Open pipeline',money(total),'Across '+open.length+' active deals')}${stat('Total contacts',contacts.length,'Your contact database')}${stat('Active deals',open.length,'In progress')}${stat('Won revenue',money(deals.filter(d=>d.stage==='Won').reduce((s,d)=>s+d.value,0)),'Recorded in this workspace')}</div><div class="dashboard-grid"><section class="panel"><div class="panelhead"><div><h3>Pipeline snapshot</h3><div class="sub">Deal value by stage</div></div><button class="smalllink" onclick="go('pipeline')">View pipeline →</button></div>${stages.slice(0,-1).map(s=>{let v=deals.filter(d=>d.stage===s).reduce((a,d)=>a+d.value,0);return `<div class="barrow"><span class="stage">${s}</span><div class="bar"><div class="fill" style="width:${total?Math.max(0,v/total*100):0}%"></div></div><strong>${money(v)}</strong></div>`}).join('')}</section><section class="panel"><div class="panelhead"><div><h3>Needs your attention</h3><div class="sub">Suggested actions • demonstration</div></div></div><div class="activity"><span class="dot">↗</span><div><b>Follow up on active proposals</b><small>${deals.filter(d=>d.stage==='Proposal').length} proposal-stage opportunities</small></div></div><div class="activity"><span class="dot">◷</span><div><b>Review negotiations</b><small>${deals.filter(d=>d.stage==='Negotiation').length} negotiation-stage opportunities</small></div></div><div class="activity"><span class="dot">✦</span><div><b>Connect your business tools</b><small>Bring your activities, billing and calendar together</small></div></div></section></div><div class="split"><section class="panel"><div class="panelhead"><h3>Recent deals</h3><button class="smalllink" onclick="go('pipeline')">See all →</button></div>${deals.slice(-4).reverse().map(d=>`<div class="activity"><span class="dot">◇</span><div style="flex:1"><b>${safe(d.title)}</b><small>${safe(d.company)}</small></div><strong>${money(d.value)}</strong></div>`).join('')}</section><section class="panel"><div class="panelhead"><h3>Recently added contacts</h3><button class="smalllink" onclick="go('contacts')">See all →</button></div>${contacts.slice(-4).reverse().map(c=>`<div class="activity"><span class="face">${safe(c.name.charAt(0))}</span><div><b>${safe(c.name)}</b><small>${safe(c.company)}</small></div></div>`).join('')}</section></div>`}
function contactTable(list){return `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr data-id="${c.id}" onclick="detail('${safe(c.id)}')"><td><span class="face">${safe(c.name.charAt(0))}</span><b style="display:inline">${safe(c.name)}</b></td><td>${safe(c.company)}</td><td>${safe(c.email)}</td><td>${safe(c.phone)}</td><td><span class="pill ${c.status==='Lead'?'warn':'blue'}">${safe(c.status)}</span></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No matching records</td></tr>`}</tbody></table></div>`}function contactPage(onlyLeads=false){let list=contacts.filter(c=>(onlyLeads?c.status==='Lead':c.status!=='Lead')&&JSON.stringify(c).toLowerCase().includes(query));return header(onlyLeads?'Leads':'Contacts',onlyLeads?'People who may become your customers.':'Converted contacts in one connected place.')+`<div class="toolbar"><span class="sub">${list.length} records • Click a contact to view details</span><button class="filter" onclick="document.getElementById('search').focus()">⌕ Search & filter</button></div>`+contactTable(list)}
function companies(){const cs=[...new Set(contacts.map(c=>c.company))].filter(c=>c.toLowerCase().includes(query));return header('Companies','One company profile connects contacts and opportunities.')+`<div class="tablewrap"><table><thead><tr><th>Company</th><th>Contacts</th><th>Pipeline value</th><th>Relationship</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${safe(c)}</b></td><td>${contacts.filter(x=>x.company===c).length}</td><td>${money(deals.filter(x=>x.company===c).reduce((a,d)=>a+d.value,0))}</td><td><span class="pill blue">Active record</span></td></tr>`).join('')}</tbody></table></div>`}
function pipeline(){return header('Sales pipeline','See every opportunity clearly and move deals through your sales process.','New deal')+`<div class="toolbar"><div class="sub">Drag a deal between stages • Changes sync to your workspace</div></div><div class="kanban">${stages.map(s=>{let list=deals.filter(d=>d.stage===s&&JSON.stringify(d).toLowerCase().includes(query));return `<div class="lane" data-stage="${s}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropDeal(event,this)"><div class="lanehead"><span>${s} <small>(${list.length})</small></span><small>${money(list.reduce((a,d)=>a+d.value,0))}</small></div>${list.map(d=>`<div class="deal" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${d.id}');this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="dealDetail('${safe(d.id)}')"><h4>${safe(d.title)}</h4><p>${safe(d.company)}</p><div class="dealfooter"><span>${money(d.value)}</span><span style="color:#8895a9">↗</span></div></div>`).join('')}</div>`}).join('')}</div>`}
function dropDeal(e,el){e.preventDefault();el.classList.remove('over');let d=deals.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(d){d.stage=el.dataset.stage;save();render()}}
function activities(){return header('Activities','All follow-ups, calls, meetings, and tasks in one view.')+`<section class="panel"><h3>Your activity workspace</h3><p class="sub">Only activities saved to your authorized workspace are shown.</p>${deals.filter(d=>d.stage==='Proposal'||d.stage==='Negotiation').map(d=>`<div class="activity"><span class="dot">◷</span><div style="flex:1"><b>Check in: ${safe(d.company)}</b><small>${safe(d.title)} • ${safe(d.stage)}</small></div><button class="btn" onclick="dealDetail('${safe(d.id)}')">Open</button></div>`).join('')}</section>`}function reports(){let won=deals.filter(d=>d.stage==='Won').reduce((a,d)=>a+d.value,0),all=deals.reduce((a,d)=>a+d.value,0);return header('Reports','Understand pipeline health and team performance.')+`<div class="stats">${stat('Total deal value',money(all),'All stages')}${stat('Won value',money(won),'Closed-won')}${stat('Open opportunities',deals.filter(d=>d.stage!=='Won').length,'Across active stages')}${stat('Contacts',contacts.length,'Relationship records')}</div><div class="dashboard-grid"><section class="panel"><h3>Stage breakdown</h3>${stages.map(s=>`<div class="barrow"><span class="stage">${s}</span><div class="bar"><div class="fill" style="width:${deals.length?deals.filter(d=>d.stage===s).length/deals.length*100:0}%"></div></div><strong>${deals.filter(d=>d.stage===s).length}</strong></div>`).join('')}</section><section class="panel"><h3>Not connected</h3><div class="activity"><span class="dot">▥</span><div><b>Revenue forecasting</b><small>Probability-weighted projections</small></div></div><div class="activity"><span class="dot">◎</span><div><b>Conversion analytics</b><small>Win rates and stage velocity</small></div></div><div class="activity"><span class="dot">◇</span><div><b>Team dashboards</b><small>Role-specific reporting</small></div></div></section></div>`}
function apps(){return header('Connected apps','Integration status is shown below; unavailable services are not connected.')+`<div class="stats">${[['▣','WorkRelief Billing'],['◷','WorkRelief Scheduling'],['☷','WorkRelief Projects'],['☑','WorkRelief Tasks'],['▤','WorkRelief Docs'],['✧','WorkRelief Workflow'],['◉','WorkRelief Desk'],['✦','WorkRelief AI']].map(([i,n])=>`<div class="stat"><div style="font-size:27px;color:#4968de">${i}</div><h3>${n}</h3><div class="sub">Planned platform integration</div><div style="margin-top:17px"><span class="pill blue">Not connected</span></div></div>`).join('')}</div>`}
function render(){document.getElementById('crumb').textContent=title(page);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));document.getElementById('content').innerHTML=({dashboard,leads:()=>contactPage(true),contacts:()=>contactPage(),companies,pipeline,activities,reports,apps})[page]()}function go(p){page=p;query='';document.getElementById('search').value='';render()}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();if(page==='dashboard'&&query)page='contacts';render()});function cyclePage(){let p=['dashboard','leads','contacts','companies','pipeline','activities','reports','apps'];go(p[(p.indexOf(page)+1)%p.length])}
function openDrawer(html){const drawer=document.getElementById('drawer');drawer.innerHTML=html;const back=document.getElementById('back');back.hidden=false;back.classList.add('show');wrEnhanceDrawer()}function closeDrawer(){const back=document.getElementById('back');back.classList.remove('show');back.hidden=true;document.getElementById('drawer').replaceChildren()}function openNew(kind){kind=kind||(page==='pipeline'?'deal':'contact');if(kind==='deal'){openDrawer(`<div class="eyebrow">SALES PIPELINE</div><h2>Create new deal</h2><p>Add an opportunity to the pipeline.</p><form onsubmit="createDeal(event)" class="formgrid"><div class="field"><label>Deal name</label><input name="title" required placeholder="New service agreement"></div><div class="field"><label>Company</label><input name="company" required placeholder="Company name"></div><div class="field"><label>Value (USD)</label><input type="number" name="value" min="0" required placeholder="10000"></div><div class="field"><label>Stage</label><select name="stage">${stages.map(s=>`<option>${s}</option>`).join('')}</select></div><button class="btn primary" type="submit">Create deal</button></form>`)}else{openDrawer(`<div class="eyebrow">RELATIONSHIPS</div><h2>Add a contact</h2><p>Build your customer database.</p><form onsubmit="createContact(event)" class="formgrid"><div class="field"><label>Full name</label><input name="name" required placeholder="Taylor Smith"></div><div class="field"><label>Company</label><input name="company" required placeholder="Company name"></div><div class="field"><label>Email</label><input type="email" name="email" placeholder="name@company.com"></div><div class="field"><label>Phone</label><input name="phone" placeholder="(555) 555-0100"></div><div class="field"><label>Relationship status</label><select name="status"><option>Lead</option><option>Prospect</option><option>Customer</option></select></div><button class="btn primary" type="submit">Save contact</button></form>`)}}
function createContact(e){e.preventDefault();let f=new FormData(e.target);contacts.unshift({id:Date.now(),...Object.fromEntries(f)});save();closeDrawer();go('contacts')}function createDeal(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));deals.unshift({id:Date.now(),...f,value:Number(f.value)});save();closeDrawer();go('pipeline')}function detail(id){let c=contacts.find(c=>c.id===id);if(!c)return;openDrawer(`<div class="eyebrow">CONTACT PROFILE</div><div class="clienthead"><span class="face">${safe(c.name[0])}</span><div><h2>${safe(c.name)}</h2><div class="sub">${safe(c.company)}</div></div></div><span class="pill blue">${safe(c.status)}</span><div class="note"><b>Contact details</b><p>${safe(c.email||'No email')}<br>${safe(c.phone||'No phone')}</p></div><h3>Linked opportunities</h3>${deals.filter(d=>d.company===c.company).map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(d.value)} • ${safe(d.stage)}</small></div></div>`).join('')||'<p>No linked deals yet</p>'}<h3>Customer timeline</h3>${contactTimeline(c)}<button class="btn primary" onclick="closeDrawer();openNew('deal')">＋ Create opportunity</button>`)}function contactTimeline(c){
 const key=(c.company||'').trim().toLowerCase();
 const entries=wrNotes.filter(a=>key && (a.related||'').trim().toLowerCase()===key).sort((a,b)=>new Date(b.created||0)-new Date(a.created||0));
 if(!entries.length)return '<div class="note">No activities logged for this account yet.</div>';
 return entries.map(a=>`<div class="activity"><span class="dot">◷</span><div><b>${safe(a.type||'Activity')} · ${safe(a.subject||'Untitled')}</b><small>${safe(a.created||'')}</small>${a.notes?`<p>${safe(a.notes)}</p>`:''}</div></div>`).join('');
}
function dealDetail(id){let d=deals.find(x=>x.id===id);if(!d)return;openDrawer(`<div class="eyebrow">DEAL DETAILS</div><h2>${safe(d.title)}</h2><p>${safe(d.company)}</p><div class="note"><b>Opportunity value</b><div style="font-size:28px;font-weight:800">${money(d.value)}</div></div><div class="field"><label>Stage</label><select onchange="moveDeal(${d.id},this.value)">${stages.map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select></div><div class="note"><b>Next step</b><p>Plan a follow-up, appointment, or proposal for this customer.</p></div><button class="btn primary" onclick="newTask('${safe(d.company).replaceAll("'","&#39;")}')">+ Create follow-up</button>`)}function moveDeal(id,s){let d=deals.find(x=>x.id===id);d.stage=s;save();render()}function resetDemo(){}render();</script>
<script>
/* WorkRelief CRM: UI state is hydrated from workspace-scoped Supabase records after authentication. */
let wrLeads=[];
let wrTasks=[];
let wrNotes=[];
let wrCompanies=[];
let wrPreferences={workspace:'Workspace',currency:'USD'};
const nextId=()=>Date.now()+Math.floor(Math.random()*10000);
function saveV2(){/* Server writes only; browser storage is not a CRM database. */}
function toast(message){let el=document.getElementById('wr-toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
const originalTitle=title;
title=function(p){return ({tasks:'My Work',settings:'Settings'})[p]||originalTitle(p)};
const originalRender=render;
render=function(){if(!document.getElementById('content'))return;document.getElementById('crumb').textContent=title(page);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));let views={dashboard,leads:leadPage,contacts:()=>contactPage(false),companies:companyPage,pipeline,activities:activityPage,reports,apps,tasks:taskPage,settings:settingsPage};document.getElementById('content').innerHTML=(views[page]||dashboard)()};
function toolbarButtons(items){return `<div class="toolbar"><div class="actions">${items.join('')}</div></div>`}
function leadPage(){let list=wrLeads.filter(x=>JSON.stringify(x).toLowerCase().includes(query));return header('Leads','Qualify inquiries and convert them into customer records.','New lead').replace("openNew('contact')","newLead()")+toolbarButtons([`<span class="sub">${list.length} leads</span>`,`<button class="action-quiet" onclick="exportCSV('leads')">↓ Export CSV</button>`])+`<div class="tablewrap"><table><thead><tr><th>Lead</th><th>Company</th><th>Source</th><th>Status</th><th>Next action</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${safe(x.name)}</b><small style="display:block;color:#8390a4">${safe(x.email)}</small></td><td>${safe(x.company)}</td><td>${safe(x.source)}</td><td><span class="pill blue">${safe(x.status)}</span></td><td><button class="record-btn" onclick="leadDetail(${x.id})">Open →</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty-note">No leads found</td></tr>'}</tbody></table></div>`}
function newLead(){openDrawer(`<div class="eyebrow">LEAD MANAGEMENT</div><h2>New lead</h2><p>Capture a potential customer.</p><form class="formgrid" onsubmit="addLead(event)"><div class="field"><label>Full name</label><input name="name" required maxlength="120"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Company</label><input name="company" required maxlength="150"></div><div class="field"><label>Source</label><select name="source"><option>Website</option><option>Referral</option><option>Event</option><option>Outbound</option><option>Other</option></select></div><button class="btn primary">Save lead</button></form>`)}
function addLead(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));wrLeads.unshift({id:nextId(),...x,status:'New'});saveV2();closeDrawer();go('leads');toast('Lead created')}
function leadDetail(id){let x=wrLeads.find(a=>a.id===id);if(!x)return;openDrawer(`<div class="eyebrow">LEAD</div><h2>${safe(x.name)}</h2><p>${safe(x.company)} · ${safe(x.email)}</p><div class="field"><label>Lead status</label><select onchange="updateLead(${id},this.value)">${['New','Contacted','Qualified','Disqualified'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" onclick="convertLead('${safe(id)}')">Convert to contact</button><button class="action-quiet" onclick="newTask('${safe(x.company).replaceAll("'",'&#39;')}')">+ Follow-up</button></div>`)}
function updateLead(id,status){let x=wrLeads.find(x=>x.id===id);if(x){x.status=status;saveV2();render();toast('Lead updated')}}
function convertLead(id){toast('Secure workspace is loading. Please try again.')}
function companyPage(){let names=[...new Set([...wrCompanies.map(x=>x.name),...contacts.map(x=>x.company),...deals.map(x=>x.company)].filter(Boolean))].filter(x=>x.toLowerCase().includes(query));return header('Companies','Keep customer accounts and their relationships together.','New company').replace("openNew('contact')","newCompany()")+toolbarButtons([`<span class="sub">${names.length} company records</span>`,`<button class="action-quiet" onclick="exportCSV('companies')">↓ Export CSV</button>`])+`<div class="tablewrap"><table><thead><tr><th>Company</th><th>Contacts</th><th>Deals</th><th>Open pipeline</th><th></th></tr></thead><tbody>${names.map(n=>`<tr><td><b>${safe(n)}</b></td><td>${contacts.filter(x=>x.company===n).length}</td><td>${deals.filter(x=>x.company===n).length}</td><td>${money(deals.filter(x=>x.company===n&&x.stage!=='Won').reduce((a,x)=>a+x.value,0))}</td><td><button class="record-btn" onclick="companyDetail(${JSON.stringify(n).replace(/"/g,'&quot;')})">View →</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty-note">No companies</td></tr>'}</tbody></table></div>`}
function newCompany(){openDrawer(`<div class="eyebrow">ACCOUNT</div><h2>New company</h2><form class="formgrid" onsubmit="addCompany(event)"><div class="field"><label>Company name</label><input name="name" required maxlength="150"></div><div class="field"><label>Industry</label><input name="industry"></div><div class="field"><label>Website</label><input name="website" type="url" placeholder="https://"></div><button class="btn primary">Save company</button></form>`)}
function addCompany(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(wrCompanies.some(c=>c.name.toLowerCase()===x.name.toLowerCase())){toast('Company already exists');return}wrCompanies.push({id:nextId(),...x});saveV2();closeDrawer();go('companies');toast('Company created')}
function companyDetail(name){let cs=contacts.filter(x=>x.company===name),ds=deals.filter(x=>x.company===name);openDrawer(`<div class="eyebrow">ACCOUNT PROFILE</div><h2>${safe(name)}</h2><p>${cs.length} contacts · ${ds.length} opportunities</p><h3>Contacts</h3>${cs.map(c=>`<div class="activity"><span class="face">${safe(c.name[0])}</span><div><b>${safe(c.name)}</b><small>${safe(c.email)}</small></div></div>`).join('')||'<p class="sub">No contacts yet.</p>'}${c.notes?`<section class="wr-detail-section"><h3>Contact notes</h3><p>${safe(c.notes)}</p></section>`:''}${Object.keys(c.custom_fields||{}).length?`<section class="wr-detail-section"><h3>Custom fields</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${safe(JSON.stringify(c.custom_fields,null,2))}</pre></section>`:''}<h3>Deals</h3>${ds.map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(d.value)} · ${safe(d.stage)}</small></div></div>`).join('')||'<p class="sub">No deals yet.</p>'}<button class="btn primary" onclick="closeDrawer();openNew('deal')">+ Create deal</button>`)}
function taskPage(){let active=wrTasks.filter(x=>!x.done).length;let list=wrTasks.filter(x=>JSON.stringify(x).toLowerCase().includes(query)).sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due));return header('My Work','Stay on top of calls, follow-ups, and commitments.','New task').replace("openNew('contact')","newTask()")+toolbarButtons([`<span class="sub">${active} tasks to complete · ${wrTasks.length} total</span>`])+`<section class="panel">${list.map(t=>`<div class="checkrow ${t.done?'done':''}"><input type="checkbox" aria-label="Complete ${safe(t.title)}" ${t.done?'checked':''} onchange="toggleTask(${t.id},this.checked)"><div style="flex:1"><b>${safe(t.title)}</b><div class="meta">${safe(t.related)} · Due ${safe(t.due||'unscheduled')}</div></div><button class="record-btn" onclick="editTask(${t.id})">Edit</button></div>`).join('')||'<div class="empty-note">No tasks match your search.</div>'}</section>`}
function newTask(related=''){openDrawer(`<div class="eyebrow">PRODUCTIVITY</div><h2>Create task</h2><form class="formgrid" onsubmit="addTask(event)"><div class="field"><label>Task name</label><input name="title" required maxlength="180"></div><div class="field"><label>Related account</label><input name="related" value="${safe(related)}"></div><div class="field"><label>Due date</label><input type="date" name="due"></div><button class="btn primary">Create task</button></form>`)}
function addTask(e){e.preventDefault();wrTasks.unshift({id:nextId(),...Object.fromEntries(new FormData(e.target)),done:false});saveV2();closeDrawer();go('tasks');toast('Task created')}
function toggleTask(id,done){let t=wrTasks.find(x=>x.id===id);if(t){t.done=done;saveV2();render();toast(done?'Task completed':'Task reopened')}}
function editTask(id){let t=wrTasks.find(x=>x.id===id);if(!t)return;openDrawer(`<div class="eyebrow">TASK</div><h2>Edit task</h2><form class="formgrid" onsubmit="updateTask(event,${id})"><div class="field"><label>Task</label><input name="title" required value="${safe(t.title)}"></div><div class="field"><label>Related</label><input name="related" value="${safe(t.related)}"></div><div class="field"><label>Due date</label><input type="date" name="due" value="${safe(t.due)}"></div><button class="btn primary">Save changes</button></form>`)}
function updateTask(e,id){e.preventDefault();Object.assign(wrTasks.find(x=>x.id===id),Object.fromEntries(new FormData(e.target)));saveV2();closeDrawer();render();toast('Task saved')}
function activityPage(){let list=wrNotes.filter(x=>JSON.stringify(x).toLowerCase().includes(query));return header('Activities','Log calls, meetings, emails, and notes.','Log activity').replace("openNew('contact')","newActivity()")+`<section class="panel"><div class="panelhead"><h3>Activity timeline</h3><button class="action-quiet" onclick="newActivity()">+ Log activity</button></div>${list.map(x=>`<div class="activity"><span class="dot">◷</span><div><b>${safe(x.type)} · ${safe(x.subject)}</b><small>${safe(x.related)} · ${safe(x.created)}</small><p>${safe(x.body)}</p></div></div>`).join('')||'<div class="empty-note">No activity logged yet. Add a note or call to begin the timeline.</div>'}</section>`}
function newActivity(related=''){openDrawer(`<div class="eyebrow">TIMELINE</div><h2>Log activity</h2><form class="formgrid" onsubmit="addActivity(event)"><div class="field"><label>Type</label><select name="type"><option>Call</option><option>Meeting</option><option>Email</option><option>Note</option></select></div><div class="field"><label>Subject</label><input name="subject" required></div><div class="field"><label>Related account</label><input name="related" value="${safe(related)}"></div><div class="field"><label>Details</label><textarea name="body" rows="4" style="width:100%;border:1px solid #dde3ed;border-radius:9px;padding:10px"></textarea></div><button class="btn primary">Save activity</button></form>`)}
function addActivity(e){e.preventDefault();wrNotes.unshift({id:nextId(),...Object.fromEntries(new FormData(e.target)),created:new Date().toLocaleString()});saveV2();closeDrawer();go('activities');toast('Activity logged')}
function settingsPage(){return header('Settings','Your current workspace and data access.')+`<div class="settingsgrid"><section class="panel"><h3>Workspace</h3><p class="sub">${safe(window.wrAuthenticatedProfile?.workspace||'Workspace')}</p><p class="sub">Role: ${safe(window.wrAuthenticatedProfile?.role||'Member')}</p><p>Workspace and team administration are managed securely by an administrator.</p></section><section class="panel"><h3>Data exports</h3><p class="sub">Exports contain records loaded from your current authorized workspace.</p><div class="actions"><button class="action-quiet" onclick="exportCSV('contacts')">Export contacts</button><button class="action-quiet" onclick="exportCSV('deals')">Export deals</button><button class="action-quiet" onclick="exportCSV('tasks')">Export tasks</button></div></section></div>`}
function saveSettings(){toast('Workspace settings are managed by administrators')}
function resetAll(){toast('Sample data resets are disabled')}
function exportCSV(what){let rows=({contacts,deals,leads:wrLeads,tasks:wrTasks,companies:wrCompanies})[what]||[];if(!rows.length){toast('No data to export');return}let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))],out=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');let url=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='workrelief-'+what+'.csv';a.click();URL.revokeObjectURL(url);toast('Export created')}
const originalOpenNew=openNew;
openNew=function(kind){if(kind==='lead'||(!kind&&page==='leads'))return newLead();if(kind==='task'||(!kind&&page==='tasks'))return newTask();if(kind==='company'||(!kind&&page==='companies'))return newCompany();if(kind==='activity'||(!kind&&page==='activities'))return newActivity();return originalOpenNew(kind)};
const originalDetail=detail;
detail=function(id){let c=contacts.find(c=>c.id===id);if(!c)return;originalDetail(id);let box=document.getElementById('drawer');let actions=document.createElement('div');actions.className='actions';actions.innerHTML=`<button class="action-quiet" onclick="newActivity('${safe(c.company)}')">+ Log activity</button><button class="action-quiet" onclick="newTask('${safe(c.company)}')">+ Follow-up</button><button class="action-quiet" onclick="editContact(${id})">Edit contact</button>`;box.appendChild(actions)};
function editContact(id){let c=contacts.find(x=>x.id===id);if(!c)return;openDrawer(`<div class="eyebrow">CONTACT</div><h2>Edit contact</h2><form class="formgrid" onsubmit="updateContact(event,${id})"><div class="field"><label>Name</label><input name="name" required value="${safe(c.name)}"></div><div class="field"><label>Company</label><input name="company" required value="${safe(c.company)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${safe(c.email)}"></div><div class="field"><label>Phone</label><input name="phone" value="${safe(c.phone)}"></div><div class="field"><label>Status</label><select name="status">${['Lead','Prospect','Customer'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary">Save contact</button></form>`)}
function updateContact(e,id){e.preventDefault();Object.assign(contacts.find(c=>c.id===id),Object.fromEntries(new FormData(e.target)));saveV2();closeDrawer();go('contacts');toast('Contact updated')}
let menuPages=['dashboard','leads','contacts','companies','pipeline','tasks','activities','reports','settings','apps'];
cyclePage=function(){let i=menuPages.indexOf(page);go(menuPages[(i+1)%menuPages.length])};
render();
</script><div class="toast" id="wr-toast" role="status" aria-live="polite"></div>
<script>

const originalDashboard=dashboard;
dashboard=function(){
 const active=deals.filter(d=>d.stage!=='Won');const total=active.reduce((a,d)=>a+Number(d.value||0),0);const won=deals.filter(d=>d.stage==='Won').reduce((a,d)=>a+Number(d.value||0),0);
 const groups=[{label:'New Lead',stage:['New','Contacted']},{label:'Qualified',stage:['Qualified']},{label:'Proposal',stage:['Proposal']},{label:'Negotiation',stage:['Negotiation']},{label:'Won',stage:['Won']}];
 const count=wrTasks.filter(t=>!t.done).length;const now=new Date();

 const lanes=groups.map(g=>{const ds=deals.filter(d=>g.stage.includes(d.stage));const sum=ds.reduce((a,d)=>a+Number(d.value||0),0);return `<div class="wr-lane" data-stage="${g.stage[0]}" ondragover="event.preventDefault();this.classList.add('isover')" ondragleave="this.classList.remove('isover')" ondrop="dropDeal(event,this);this.classList.remove('isover')"><div class="wr-lanename">${g.label}</div><div class="wr-lanestats">${ds.length} deals · ${money(sum)}</div>${ds.slice(0,4).map(card).join('')}${ds.length>4?`<button class="smalllink" onclick="go('pipeline')">+${ds.length-4} more</button>`:''}</div>`}).join('');
 const activities=wrTasks.filter(t=>!t.done).slice(0,4);
 const upcoming=activities.map((t,i)=>`<div class="wr-event"><time>${safe(t.due||'Upcoming')}</time><div class="wr-event-icon">${['☎','▣','✉','▤'][i%4]}</div><div><strong>${safe(excerpt(t.title,29))}</strong><small>${safe(excerpt(t.related||'CRM task',34))}</small></div></div>`).join('') || `<div class="sub">No upcoming tasks. <button class="smalllink" onclick="newTask()">Add a task</button></div>`;
 const updates=wrNotes.slice(0,4).map((n,i)=>`<div class="wr-update"><span class="wr-glyph">${['✧','✉','◇','▣'][i%4]}</span><div><strong>${safe(excerpt(n.related||n.subject,25))}</strong><small>${safe(excerpt(n.type+' · '+n.subject,34))}</small></div></div>`).join('') || `<p class="sub">Customer updates appear when you log activities.</p>`;
 const values=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return deals.filter(x=>{if(!x.created_at)return false;const c=new Date(x.created_at);return c.getFullYear()===d.getFullYear()&&c.getMonth()===d.getMonth()}).reduce((sum,x)=>sum+Number(x.value||0),0)});const peak=Math.max(...values,1);const months=Array.from({length:6},(_,i)=>{let d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return d.toLocaleDateString('en-US',{month:'short'})});
 const chart=values.map((h,i)=>`<div class="wr-chartgroup"><div class="wr-chartbar" style="height:${Math.round(h/peak*100)}%"></div><small>${months[i]}</small></div>`).join('');
 const recent=wrNotes.slice(0,4).map((n,i)=>`<div class="wr-actline"><span class="wr-event-icon">${['☎','✉','◉','▣'][i%4]}</span><div style="min-width:0"><strong>${safe(excerpt(n.subject,34))}</strong><small>${safe(excerpt(n.related||n.type,36))}</small></div><time>${safe(n.created?.slice(0,10)||'Recent')}</time></div>`).join('') || `<p class="sub">No activities yet. <button class="smalllink" onclick="newActivity()">Log activity →</button></p>`;
 return `<div class="wr-hero"><div><div class="eyebrow">WELCOME TO WORKRELIEF CRM</div><h1>Here’s what’s happening with your business today.</h1></div><div class="date-pill">▣ &nbsp; ${datestr}</div></div><div class="wr-kpis"><div class="wr-kpi"><div class="kpi-symbol">▥</div><div><div class="kpi-label">Pipeline Value</div><div class="kpi-value">${money(total)}</div><div class="kpi-note neutral">${active.length} open deals</div></div></div><div class="wr-kpi"><div class="kpi-symbol mint">♕</div><div><div class="kpi-label">Total Won</div><div class="kpi-value">${money(won)}</div><div class="kpi-note neutral">All-time closed won</div></div></div><div class="wr-kpi"><div class="kpi-symbol">◉</div><div><div class="kpi-label">Open Tasks</div><div class="kpi-value">${count}</div><div class="kpi-note neutral">Follow-ups and reminders</div></div></div><div class="wr-kpi"><div class="kpi-symbol lavender">◷</div><div><div class="kpi-label">Win Rate</div><div class="kpi-value">${deals.length?Math.round(deals.filter(x=>x.stage==='Won').length/deals.length*100):0}%</div><div class="kpi-note neutral">Won / all recorded deals</div></div></div></div><div class="wr-grid"><section class="wr-section"><div class="wr-panelhead"><h2>Deals Pipeline</h2><div><small>Total open: <b>${money(total)}</b></small> <button onclick="go('pipeline')">View all →</button></div></div><div class="wr-board">${lanes}</div></section><aside class="wr-side"><section class="wr-section"><div class="wr-panelhead"><h2>Upcoming Activities</h2><button onclick="go('tasks')">View all →</button></div>${upcoming}</section><section class="wr-section"><div class="wr-panelhead"><h2>Recent Customer Updates</h2><button onclick="go('activities')">View all →</button></div>${updates}</section></aside></div><div class="wr-bottom"><section class="wr-section"><div class="wr-panelhead"><h2>Pipeline Value Trend</h2><small>Recorded deal creation by month</small></div><div class="wr-chart">${chart}</div><div class="wr-legend"><b>●</b> Based on saved deal creation dates</div></section><section class="wr-section"><div class="wr-panelhead"><h2>Recent Activity</h2><button onclick="go('activities')">View all →</button></div>${recent}</section></div>`;
};
render();

">${safe(x.name?.[0]||'?')}</span><div><b>${safe(x.name)}${x.is_primary_company_contact?' · Primary contact':''}</b><small>${safe(x.email||'')}${x.contact_role?' · '+safe(x.contact_role):''}${x.job_title?' · '+safe(x.job_title):''}</small></div></div>`).join('')||'<p class="sub">No contacts linked yet.</p>'}${ll.length?`<p class="sub">${ll.length} unconverted lead(s) associated with this company.</p>`:''}</section><section class="wr-detail-section"><h3>Opportunities</h3>${opportunities.map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(Number(d.amount||0))} · ${safe(d.stage)}</small></div></div>`).join('')||'<p class="sub">No opportunities yet.</p>'}</section><section class="wr-detail-section"><h3>Recent activities</h3>${activities.map(x=>`<div class="activity"><span class="dot">◷</span><div><b>${safe(x.title)}</b><small>${safe(x.kind)} · ${safe(x.created_at?.slice(0,10)||'')}</small></div></div>`).join('')||'<p class="sub">No activities logged.</p>'}</section><section class="wr-detail-section"><h3>Customer service</h3>${cases.map(x=>`<div class="activity"><div><b>${safe(x.subject)}</b><small>${safe(x.status)} · ${safe(x.priority)}</small></div></div>`).join('')||'<p class="sub">No support cases.</p>'}</section>${companyEmailsMarkup(c)}<section class="wr-detail-section"><h3>Account history</h3><div id="wr-company-history-items">${timeline}</div>${history.length===30?`<button class="btn" onclick="wrLoadOlderHistory(this,'company_id','${id}')" data-offset="30">Load older history</button>`:''}</section><div class="actions"><button class="btn primary" onclick="newTaskForCompany('${id}')">+ Follow-up</button><button class="btn" onclick="newActivityForCompany('${id}')">+ Log activity</button></div>`);

      window.newContactForCompany=id=>{openNew('contact');const form=document.querySelector('#drawer form');const sel=form?.querySelector('[name=company_id]');if(sel){const opt=document.createElement('option');opt.value=id;opt.textContent='Selected company';opt.selected=true;sel.append(opt)}};

          openDrawer(`<div class="eyebrow">CONTACT PROFILE</div><div class="clienthead"><span class="face">${safe(c.name?.[0]||'?')}</span><div><h2>${safe(c.name)}</h2><p class="sub">${safe(companyName)} ${c.is_primary_company_contact?'· Primary contact':''}</p></div></div><div class="note"><b>Contact details</b><p>${safe(c.email||'No email')} · ${safe(c.phone||'No phone')}</p>${c.job_title?`<p>${safe(c.job_title)}</p>`:''}${c.contact_role?`<p>Role: ${safe(c.contact_role)}</p>`:''}${c.department?`<p>Department: ${safe(c.department)}</p>`:''}</div><h3>Deals</h3>${ds.map(d=>`<div class="activity"><span class="dot">◇</span><div><b>${safe(d.title)}</b><small>${money(Number(d.amount||0))} · ${safe(d.stage)}</small></div></div>`).join('')||'<p class="sub">No linked deals.</p>'}${relationships}<h3>Customer timeline</h3><div id="wr-contact-history-items">${timeline}</div>${events.length===30?`<button class="btn" onclick="wrLoadOlderHistory(this,'contact_id','${c.id}')" data-offset="30">Load older history</button>`:''}<div class="actions"><button class="btn" onclick="newTaskForContact('${safe(id)}')">+ Follow-up</button><button class="btn" onclick="newActivityForContact('${safe(id)}')">+ Log activity</button></div>`);

      window.wrAddContactRelationship=async(e,id)=>{

      window.newTaskForContact=async id=>{await newTask();const sel=document.querySelector('#drawer form [name=contact_id]');if(sel){if(![...sel.options].some(x=>x.value===id))sel.add(new Option('Selected contact',id));sel.value=id}};

      // Replace illustrative dashboard with a real-data-only view.

      const viewRecord=(eyebrow,title,body,handler,label)=>openDrawer(`<div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="sub">Changes are saved to your WorkRelief workspace.</p><form class="wr-management-form" onsubmit="${handler}">${body}${formActions(label)}</form>`);
      window.wrFilterLeadStage=value=>{wrListState.leads.stage=value;wrListState.leads.page=0;void wrLoadList('leads',true)};
      window.wrLeadReports=async()=>{
        try{

          const a=summary.data||{};

          openDrawer(`<div class="wr-lead-insights"><div class="eyebrow">LEAD ANALYTICS</div><h2>Lead insights</h2><p class="sub">Live performance and qualification trends for your workspace.</p><div class="wr-lead-metrics">${cards}</div><section class="wr-lead-pipeline"><div class="wr-lead-section-heading"><h3>Qualification pipeline</h3><p class="sub">Lead volume and average qualification score by stage</p></div><div class="tablewrap"><table><thead><tr><th>Stage</th><th>Leads</th><th>Average score</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="wr-lead-empty">No leads recorded yet.</td></tr>'}</tbody></table></div></section><div class="wr-lead-footer"><span>Data from your current workspace</span><button type="button" class="btn" onclick="closeDrawer()">Close</button></div></div>`);
        }catch(error){fail(error)}

          openDrawer(`<div class="eyebrow">LEAD CAPTURE</div><h2>Capture sources</h2><p class="sub">Create a private integration key for each form, website backend, or connected service. Never place a key in a public webpage or share it by email.</p>${keyRows||'<p class="sub">No integration keys have been created.</p>'}<form class="wr-management-form" onsubmit="wrCreateLeadSource(event)">${section('New capture source',field('Source name *','label','','text','required maxlength="120"')+choice('Lead source','source',[['Website','Website'],['Referral','Referral'],['Event','Event'],['Advertising','Advertising'],['Chat','Chat'],['Email','Email'],['Other','Other']],'Website'))}${formActions('Create private key')}</form><p class="sub">Use your website or integration server to connect this source. Integration instructions belong in developer documentation. Never expose private keys in public webpages.</p>`);
        }catch(error){fail(error)}
      };
      window.wrCreateLeadSource=async e=>{
        e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const btn=e.target.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
        try{
          const {data,error}=await sb.rpc('wr_create_lead_capture_key',{p_workspace_id:workspaceId,p_label:f.label.trim(),p_source:f.source});if(error)throw error;
          const secret=String(data||'');if(!/^[a-f0-9]{64}$/.test(secret))throw Error('Unable to generate a capture key');
          const panel=document.createElement('section');panel.className='wr-form-section';
          panel.innerHTML=`<h3>New private key — copy now</h3><p class="sub">This secret will not be shown again. Keep it in your integration server's environment variables.</p><textarea rows="3" readonly aria-label="New private capture key">${safe(secret)}</textarea><button type="button" class="btn" data-copy-lead-key>Copy key</button>`;

         (wrReportError?`<div class="empty-note" role="alert">${safe(wrReportError)}</div>`:'')+
         (wrReportLoading?'<p class="sub">Loading current reports…</p>':'')+
         (info?`<div class="stats">${stat('Open pipeline',money(Number(stats.open_pipeline||0)),String(stats.open_deals||0)+' open deals')}${stat('Won revenue',money(Number(stats.won_revenue||0)),String(stats.won_deals||0)+' won deals')}${stat('Companies',stats.companies||0,'Workspace accounts')}${stat('Contacts',stats.contacts||0,'Converted contacts')}</div><section class="panel" style="margin-top:20px"><h3>Opportunity stage breakdown</h3>${stages.map(x=>`<div class="barrow"><span class="stage">${safe(x.stage)}</span><div class="bar"><div class="fill" style="width:${total?Math.round(Number(x.deal_count)/total*100):0}%"></div></div><strong>${Number(x.deal_count).toLocaleString()}</strong><span class="sub">${money(Number(x.total_amount||0))}</span></div>`).join('')||'<p class="sub">No opportunities yet.</p>'}</section>`:'')+
         '';
      };
      const wrReportFetch=async()=>{
        const request=++wrReportRequest;wrReportLoading=true;wrReportError='';
        if(page==='reports')document.getElementById('content').innerHTML=wrReportMarkup();
        try{
          const [summary,stages]=await Promise.all([
            sb.rpc('wr_crm_dashboard_summary',{p_workspace_id:workspaceId}),
            sb.rpc('wr_crm_stage_summary',{p_workspace_id:workspaceId})
          ]);
          if(summary.error)throw summary.error;if(stages.error)throw stages.error;
          if(!summary.data)throw Error('Report access denied');
          if(request!==wrReportRequest)return;
          wrReportData={summary:summary.data,stages:stages.data||[]};
        }catch(err){if(request!==wrReportRequest)return;wrReportError=err?.message||'Unable to load reports';console.error(err)}
        finally{if(request===wrReportRequest){wrReportLoading=false;if(page==='reports')document.getElementById('content').innerHTML=wrReportMarkup()}}
      };
      window.wrRefreshReports=()=>wrReportFetch();
      // Exports are user-initiated complete server queries, never snapshots of a visible page.
      exportCSV=async what=>{
        const mapping={contacts:['crm_contacts',{status:'lead'},true],leads:['crm_contacts',{status:'lead'},false],companies:['crm_companies',{},false],deals:['crm_deals',{},false],tasks:['crm_activities',{kind:'task'},false]};
        const spec=mapping[what];if(!spec){toast('Unknown export');return}
        try{
          let data=[];const [table,filters,excludeLead]=spec;
          for(let pageNo=0;pageNo<1000;pageNo++){
            const result=await crmPage({sb,workspaceId,table,page:pageNo,pageSize:200,filters:excludeLead?{}:filters,exclude:excludeLead?filters:{}});
            data.push(...result.records);
            if(result.records.length<200||(result.total!==null&&data.length>=result.total))break;
            if(pageNo===999)throw Error('Export exceeds 200,000 records; use a managed export');
          }
          if(!data.length){toast('No records to export');return}
          const columns=[...new Set(data.flatMap(row=>Object.keys(row)))];
          const csv=[columns.join(','),...data.map(row=>columns.map(key=>'"'+String(typeof row[key]==='object'?JSON.stringify(row[key]):row[key]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');
          const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
          const a=document.createElement('a');a.href=url;a.download='workrelief-'+what+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
          toast('Export ready');
        }catch(err){fail(err)}
      };
      const wrReportsPreviousRender=render;
      render=function(){
        if(page==='reports'){
          document.getElementById('crumb').textContent=title(page);
          document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));
          document.getElementById('content').innerHTML=wrReportMarkup();
          if(!wrReportData&&!wrReportLoading&&!wrReportError)void wrReportFetch();
          return;
        }
        return wrReportsPreviousRender();
      };
      const wrDatabaseRender=render;
      render=function(){wrDatabaseRender();if(page==='dashboard'&&!wrLiveDashboard&&!wrDashboardLoading&&!wrDashboardError)wrDashboardFetch();};
      document.getElementById('wr-manual-refresh')?.addEventListener('click',async()=>{
        const button=document.getElementById('wr-manual-refresh');
        if(button.disabled)return;
        button.disabled=true;button.textContent='↻ Loading…';
        try{
          if(page==='dashboard'){await wrRefreshDashboard();return;}
          else if(['leads','contacts','companies','pipeline'].includes(page))await wrLoadList(page);
          else if(page==='tasks'||page==='activities')await wrLoadAux(page);
          else if(page==='reports')await wrReportFetch();
          else {toast('This view is up to date');}
          toast('View is up to date');
        }catch(error){fail(error)}finally{button.disabled=false;button.textContent='↻ Refresh'}
      });
      // Keep the document mounted; saving data does not navigate or replace the entire application.
      // Account editors already have comprehensive sections; ensure Save closes on successful update.
      render();

      document.body.classList.remove('wr-auth-pending');document.body.classList.add('wr-auth-ready');
      sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.replace('login.html')});
    }
  }
}catch(err){deny('Unable to verify access: '+(err?.message||'unknown error'));}
</script>

<script>
function toggleCRMNav(force){
 const side=document.querySelector('.sidebar'),back=document.getElementById('wr-mobile-backdrop'),button=document.getElementById('wr-mobile-menu');
 const open=typeof force==='boolean'?force:!side.classList.contains('wr-open');
 side.classList.toggle('wr-open',open);back.hidden=!open;
 if(button)button.setAttribute('aria-expanded',String(open));
}
document.getElementById('wr-mobile-backdrop')?.addEventListener('click',()=>toggleCRMNav(false));
document.querySelectorAll('.sidebar .nav [data-page]').forEach(b=>b.addEventListener('click',()=>toggleCRMNav(false)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleCRMNav(false)});
</script>

<script>
(()=>{
 const trigger=document.getElementById('wr-user-trigger'),menu=document.getElementById('wr-user-menu');
 const close=()=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false')};
 trigger.addEventListener('click',()=>{const opening=menu.hidden;menu.hidden=!opening;trigger.setAttribute('aria-expanded',String(opening))});
 document.addEventListener('click',e=>{if(!document.getElementById('wr-user-menu-wrap').contains(e.target))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 document.getElementById('wr-settings-action').addEventListener('click',()=>{close();go('settings')});
 document.getElementById('wr-profile-action').addEventListener('click',()=>{
  close();const p=window.wrAuthenticatedProfile||{};
  const container=document.createElement('div');container.className='wr-profile-details';
  const heading=document.createElement('h2');heading.textContent='My profile';container.append(heading);
  const description=document.createElement('p');description.textContent='Your authenticated WorkRelief account information.';container.append(description);
  for(const [label,value] of [['Name',p.name],['Email',p.email],['Workspace',p.workspace],['Role',p.role]]){
   const field=document.createElement('div');field.className='note';const title=document.createElement('strong');title.textContent=label;const detail=document.createElement('div');detail.textContent=value||'Not provided';field.append(title,detail);container.append(field);
  }
  openDrawer(container.outerHTML);
 });
})();

function wrStateOptions(current){
  const states = [["AL", "Alabama"], ["AK", "Alaska"], ["AZ", "Arizona"], ["AR", "Arkansas"], ["CA", "California"], ["CO", "Colorado"], ["CT", "Connecticut"], ["DE", "Delaware"], ["FL", "Florida"], ["GA", "Georgia"], ["HI", "Hawaii"], ["ID", "Idaho"], ["IL", "Illinois"], ["IN", "Indiana"], ["IA", "Iowa"], ["KS", "Kansas"], ["KY", "Kentucky"], ["LA", "Louisiana"], ["ME", "Maine"], ["MD", "Maryland"], ["MA", "Massachusetts"], ["MI", "Michigan"], ["MN", "Minnesota"], ["MS", "Mississippi"], ["MO", "Missouri"], ["MT", "Montana"], ["NE", "Nebraska"], ["NV", "Nevada"], ["NH", "New Hampshire"], ["NJ", "New Jersey"], ["NM", "New Mexico"], ["NY", "New York"], ["NC", "North Carolina"], ["ND", "North Dakota"], ["OH", "Ohio"], ["OK", "Oklahoma"], ["OR", "Oregon"], ["PA", "Pennsylvania"], ["RI", "Rhode Island"], ["SC", "South Carolina"], ["SD", "South Dakota"], ["TN", "Tennessee"], ["TX", "Texas"], ["UT", "Utah"], ["VT", "Vermont"], ["VA", "Virginia"], ["WA", "Washington"], ["WV", "West Virginia"], ["WI", "Wisconsin"], ["WY", "Wyoming"], ["DC", "District of Columbia"], ["PR", "Puerto Rico"], ["GU", "Guam"], ["VI", "U.S. Virgin Islands"], ["AS", "American Samoa"], ["MP", "Northern Mariana Islands"]];
  const value=String(current||'').trim();
  const match=states.find(([code,label])=>code.toLowerCase()===value.toLowerCase()||label.toLowerCase()===value.toLowerCase());
  const selected=match?match[0]:value;
  const known=states.some(([code])=>code===selected);
  return `<option value="">Select state / territory</option>`+
    (!known&&selected?`<option value="${safe(selected)}" selected>${safe(selected)} (previously saved)</option>`:'')+
    states.map(([code,label])=>`<option value="${code}" ${selected===code?'selected':''}>${safe(label)} (${code})</option>`).join('');
}
