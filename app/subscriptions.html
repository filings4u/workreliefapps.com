<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscriptions | WorkRelief</title><style>
:root{font:14px Inter,system-ui,Arial,sans-serif;color:#11284b;--accent:#1768f5}*{box-sizing:border-box}body{margin:0;background:#f5f8fd}header{background:#fff;border-bottom:1px solid #dce6f3;padding:19px max(22px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}header img{width:148px}nav{display:flex;gap:15px;flex-wrap:wrap}a{color:var(--accent);text-decoration:none;font-weight:700}main{max-width:1120px;margin:38px auto;padding:0 20px 90px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--accent)}h1{font-size:36px;margin:9px 0}h2{font-size:19px;margin:0 0 16px}.intro{color:#637994;line-height:1.6;margin-bottom:30px}.panel{background:white;border:1px solid #dce6f3;border-radius:16px;margin:16px 0;padding:24px;box-shadow:0 5px 26px #10264b06}.flex{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.muted{color:#657b98}.pill{display:inline-block;border-radius:30px;padding:7px 11px;background:#eaf4f9;color:#176178;font-weight:800;font-size:12px}.detail{font-size:13px;color:#58708b;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;background:var(--accent);color:white;border:1px solid var(--accent);padding:11px 16px;border-radius:9px;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{color:#183858;background:#fff;border-color:#cad8ea}.warning{color:#ab3c49;font-size:13px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#0b1c38aa;display:grid;place-items:center;padding:20px;z-index:50}.dialog{background:white;padding:27px;border-radius:17px;max-width:480px;width:100%;box-shadow:0 24px 60px #091d383d}.dialog p{line-height:1.6;color:#56708e}.dialog .actions{justify-content:flex-end;margin-top:22px}.empty{padding:35px;text-align:center;color:#667d99;border:1px dashed #d5e1f0;border-radius:14px;background:#fff}@media(max-width:640px){h1{font-size:29px}.panel{padding:18px}header{padding:18px}}
</style></head><body><header><img src="../assets/img/logo.png" alt="WorkRelief"><nav><a id="workspace" href="crm.html">Workspace</a><a id="billing-link" href="billing.html">Billing</a><a id="subscriptions-link" href="subscriptions.html">Subscriptions</a></nav></header><main><div class="eyebrow">WORKRELIEF · WORKSPACE BILLING</div><h1>Subscriptions</h1><p class="intro">Manage only the applications, team seats, and White Label upgrades your workspace has purchased.</p><div id="state" role="status">Loading your workspace billing details…</div><div id="records"></div></main><div id="dialog" class="overlay hidden" role="presentation"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title"><div class="eyebrow">WORKSPACE BILLING</div><h2 id="dialog-title">Cancel subscription?</h2><p id="dialog-text"></p><div class="actions"><button type="button" class="secondary" id="keep">Keep subscription</button><button type="button" id="confirm">Schedule cancellation</button></div></section></div><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://cqzwoskpgefacghdnuyz.supabase.co','sb_publishable_CoIoX7Pinqd2o4kJwqCTqA_RKmePPZt');
const $=id=>document.getElementById(id);const qp=new URLSearchParams(location.search);let workspace='',token='',payload=null;
const money=(c,cur)=>new Intl.NumberFormat('en-US',{style:'currency',currency:(cur||'usd').toUpperCase()}).format(Number(c||0)/100);
const niceDate=t=>t?new Date(typeof t==='number'?t*1000:t).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'Not available';
const node=(tag,className,value)=>{const e=document.createElement(tag);if(className)e.className=className;if(value!=null)e.textContent=value;return e};
function info(parent,label,value){const row=node('div','detail');const strong=node('strong','',label+': ');row.append(strong,document.createTextNode(value));parent.append(row)}
async function api(action,more={}){const r=await fetch('https://cqzwoskpgefacghdnuyz.supabase.co/functions/v1/workrelief-billing',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({action,workspace_id:workspace,...more})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Billing is temporarily unavailable');return data}
function brand(apps){const colors={crm:'#1768f5',scheduling:'#12b8b1',forms:'#ff8419',desk:'#ed3192',hr:'#8839ec',training:'#247bff',compliance:'#10c66e',time:'#8a3cf6',tasks:'#e59a32',projects:'#4c77d9',chat:'#7a4fdd',docs:'#5b77a6',sign:'#e68c45',billing:'#3f94cc',field:'#8a69d4',inventory:'#c77842',assets:'#3b81ac',workflow:'#8467d0',ai:'#9457e8'};return colors[String(apps?.[0]||'').toLowerCase()]||'#1768f5'}
function summary(row){const parts=[(row.apps||[]).join(', '),row.seats?row.seats+' additional team seat(s)':'',(row.white||[]).length?'White Label: '+row.white.join(', '):''];return parts.filter(Boolean).join(' · ')||row.label}
function receiptPDF(r){const C=window.jspdf?.jsPDF;if(!C)throw Error('Receipt generator unavailable');const doc=new C({unit:'pt',format:'letter'}),hex=brand((r.apps||[]).map(v=>v.toLowerCase())),accent=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));doc.setFillColor(...accent);doc.rect(0,0,612,9,'F');doc.setTextColor(16,38,75);doc.setFont('helvetica','bold');doc.setFontSize(25);doc.text('workrelief',42,73);doc.setFontSize(20);doc.text('Payment receipt',42,138);doc.setFillColor(241,247,253);doc.roundedRect(42,160,528,98,11,11,'F');doc.setFontSize(11);doc.text('TOTAL PAID',60,185);doc.setFontSize(27);doc.text(money(r.amount_cents,r.currency),60,229);doc.setTextColor(...accent);doc.setFontSize(11);doc.text('PAID',548,202,{align:'right'});const rows=[['Applications',(r.apps||[]).join(', ')||'None'],['Additional team members',String(r.seats||0)],['White Label',(r.white||[]).join(', ')||'None'],['Billing frequency',r.cycle==='annual'?'Yearly':'Monthly'],['Payment date',niceDate(r.paid_at)],['Receipt reference',r.reference]];let y=300;for(const [key,val] of rows){doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(101,119,147);doc.text(key,42,y);doc.setFont('helvetica','bold');doc.setTextColor(16,38,75);const lines=doc.splitTextToSize(val||'—',270);doc.text(lines,300,y);y+=Math.max(40,lines.length*14+18);doc.setDrawColor(222,232,242);doc.line(42,y-18,570,y-18)}doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(101,119,147);doc.text('WorkRelief · One platform. Less busywork.',42,750);doc.save('workrelief-receipt-'+String(r.reference).replace(/[^a-z0-9-]/gi,'')+'.pdf')}
function render(){const root=$('records');root.replaceChildren();const items=true?payload.subscriptions:payload.receipts;$('state').textContent=true?'Only your purchased subscriptions appear below.':'Download receipts from your confirmed purchases and paid renewals.';if(!items.length){root.append(node('div','empty',true?'No active purchased subscriptions were found.':'No paid receipts were found.'));return}
for(const row of items){const card=node('section','panel');const head=node('div','flex'),left=node('div');left.append(node('h2','',true?row.label:'Payment receipt · '+niceDate(row.paid_at)));left.append(node('div','muted',summary(row)));head.append(left);head.append(node('span','pill',true?(row.cancel_at_period_end?'Ends at term end':row.status):money(row.amount_cents,row.currency)));card.append(head);const details=node('div');if(true){info(details,'Billing frequency',row.cycle==='annual'?'Yearly':'Monthly');info(details,row.cancel_at_period_end?'Service ends':'Current period ends',niceDate(row.current_period_end));if(row.amount_cents!=null)info(details,'Subscription items',money(row.amount_cents,row.currency));if(row.unavailable)details.append(node('p','warning','Unable to verify the latest subscription status.'));}else{info(details,'Reference',row.reference);info(details,'Billing frequency',row.cycle==='annual'?'Yearly':'Monthly')}card.append(details);const actions=node('div','actions');actions.style.marginTop='18px';if(true){if(payload.can_cancel&&!row.cancel_at_period_end&&!row.unavailable&&['active','trialing','past_due'].includes(row.status)){const cancel=node('button','secondary','Cancel subscription');cancel.onclick=()=>askCancel(row);actions.append(cancel)}}else{const button=node('button','','Download receipt (PDF)');button.onclick=()=>{try{receiptPDF(row)}catch(e){$('state').textContent=e.message}};actions.append(button)}card.append(actions);root.append(card)}}
function askCancel(row){$('dialog-text').textContent='This will stop renewal for '+summary(row)+'. Your paid access remains available until the current billing period ends. This cannot be undone here.';$('dialog').classList.remove('hidden');const finish=()=>{$('dialog').classList.add('hidden');$('confirm').onclick=null};$('keep').onclick=finish;$('confirm').onclick=async()=>{const b=$('confirm');b.disabled=true;try{await api('cancel',{order_id:row.id});finish();payload=await api('list');render()}catch(e){$('dialog-text').textContent=e.message||'Unable to schedule cancellation'}finally{b.disabled=false}}}
try{const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('login.html?next='+encodeURIComponent('app/'+(true?'subscriptions':'billing')+'.html'));}else{const {data,error}=await sb.from('workspace_members').select('workspace_id,role').eq('user_id',user.id);if(error)throw error;const member=data?.find(x=>x.workspace_id===qp.get('workspace'))||data?.[0];if(!member)throw Error('No workspace access');workspace=member.workspace_id;token=(await sb.auth.getSession()).data.session?.access_token||'';if(!token)throw Error('Please sign in again');for(const id of ['workspace','billing-link','subscriptions-link'])$(id).href+= '?workspace='+encodeURIComponent(workspace);payload=await api('list');render()}}catch(e){$('state').textContent=e.message||'Unable to load billing';}
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js" defer></script></body></html>
